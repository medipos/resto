<script type="module">

const RESTAURANT_ID = 'main';   // single-property install

const fbApp   = initializeApp(firebaseConfig);

/* =========================================================

let CURRENT_TABLE   = null;   // {id, tableNo, currentSession}

/* =========================================================

// Escapes text nodes. Does NOT make a string safe inside an attribute.
function esc(s){ const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
// Attribute-safe: also neutralises the quote characters that let a value
// break out of an attribute and inject an event handler.
function escAttr(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function money(n){ return '₹' + Number(n || 0).toLocaleString('en-IN'); }
function uid(){ return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function toMillis(ts){
  if(!ts) return 0;
  if(typeof ts.toMillis === 'function') return ts.toMillis();
  return new Date(ts).getTime() || 0;
}
function el(id){ return document.getElementById(id); }

function showToast(msg, type){
  const colors = { success:'bg-basil', error:'bg-chili', warning:'bg-saffron', info:'bg-ink' };
  const node = document.createElement('div');
  node.className = `${colors[type] || 'bg-ink'} text-white text-sm font-semibold px-4 py-2.5 rounded-full shadow-lg fade-in max-w-sm text-center`;
  node.textContent = msg;
  el('toastRoot').appendChild(node);
  setTimeout(() => node.remove(), 3200);
}
function showMsg(node, text, type){
  if(!node) return;
  const cls = type === 'error' ? 'bg-chili/10 text-chili' : 'bg-basil/10 text-basil';
  node.innerHTML = `<div class="${cls} text-sm px-3 py-2 rounded-xl mb-3">${esc(text)}</div>`;
}
function clearMsg(node){ if(node) node.innerHTML = ''; }

function updateOfflineBanner(){ el('offlineBanner').classList.toggle('hidden-view', navigator.onLine); }
window.addEventListener('online',  () => { updateOfflineBanner(); showToast('Back online', 'success'); });
window.addEventListener('offline', () => { updateOfflineBanner(); showToast('Connection lost', 'error'); });
updateOfflineBanner();
function requireOnline(){
  if(!navigator.onLine){ showToast("You're offline — reconnect to save this", 'error'); return false; }
  return true;
}

/* ---------- sound ---------- */
let AUDIO_CTX = null;
function unlockAudio(){
  try{
    AUDIO_CTX = AUDIO_CTX || new (window.AudioContext || window.webkitAudioContext)();
    if(AUDIO_CTX.state === 'suspended') AUDIO_CTX.resume();
  } catch(e){}
}
function playChime(kind){
  if(!SOUND_ON) return;
  try{
    unlockAudio();
    if(!AUDIO_CTX) return;
    const freqs = kind === 'call' ? [880, 660] : [520, 780];
    freqs.forEach((f, i) => {
      const osc = AUDIO_CTX.createOscillator(), gain = AUDIO_CTX.createGain();
      osc.frequency.value = f; osc.type = 'sine';
      const t = AUDIO_CTX.currentTime + i * 0.16;
      gain.gain.setValueAtTime(0.15, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.connect(gain).connect(AUDIO_CTX.destination);
      osc.start(t); osc.stop(t + 0.3);
    });
  } catch(e){}
}

  });
}

/* ---------- PWA manifest, generated in-page so this stays one file ---------- */
(function injectManifest(){
  const iconSvg = (size) => `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 512 512">
<rect width="512" height="512" fill="#211B14"/>
<circle cx="256" cy="256" r="208" fill="none" stroke="#E0912F" stroke-width="16"/>
<text x="256" y="256" font-family="Georgia,serif" font-size="230" font-weight="700" fill="#FBF6EC" text-anchor="middle" dominant-baseline="central">HS</text>
</svg>`;
  const iconUrl = (s) => 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(iconSvg(s))));
  const manifest = {
    name: 'Hotel Sandeep', short_name: 'H. Sandeep',
    description: 'QR ordering, kitchen, counter and admin for Hotel Sandeep',
    start_url: './', scope: './', display: 'standalone',
    background_color: '#211B14', theme_color: '#211B14',
    icons: [
      { src: iconUrl(192), sizes: '192x192', type: 'image/svg+xml', purpose: 'any' },
      { src: iconUrl(512), sizes: '512x512', type: 'image/svg+xml', purpose: 'any' }
    ]
  };
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
  document.head.appendChild(link);

   4. BOOT
   ========================================================= */
const NAV_ALLOWED = {
  kitchen:   ['admin','management','manager','kitchen'],
  pos:       ['admin','management','manager','counter'],
  tables:    ['admin','management','manager','counter'],
  manager:   ['admin','management','manager'],
  counter:   ['admin','management','counter'],
  analytics: ['admin','management'],
  admin:     ['admin','management'],
};

async function boot(){
  const tableToken = new URLSearchParams(location.search).get('table');
  IS_CUSTOMER = !!tableToken;

  try{
    const snap = await getDoc(restRef());
    if(snap.exists()){
      applyBranding(snap.data().name);
      applyLogo(snap.data().logoUrl || null);
    }
  } catch(e){ /* rules may block this until sign-in; retried below */ }

  if(IS_CUSTOMER){
    // Customers get an anonymous identity so security rules can require auth
    // instead of leaving the database open to the world.
    try{
      if(!auth.currentUser) await signInAnonymously(auth);
    } catch(e){
      showOnly('customerView');
      el('menuRoot').innerHTML = errorPanel('Cannot reach the restaurant', 'Check your connection and reload this page.');
      return;
    }
    await bootCustomer(tableToken);
  } else {
    onAuthStateChanged(auth, async (user) => {
      if(user && user.isAnonymous){
        // Left over from scanning a table QR on this device. Without this the app
        // sat on the loading screen forever, because an anonymous user is neither
        // a signed-out visitor nor a staff member.
        await signOut(auth);
        return;
      }
      if(user){
        if(STAFF_BOOTED && CURRENT_USER?.uid === user.uid) return;  // token refresh, not a new sign-in
        CURRENT_USER = user;
        bootStaff(user);
      } else {
        teardown();
        showOnly('loginView');
      }
    });
  }
}

function teardown(){
  while(UNSUBS.length){ try{ UNSUBS.pop()(); } catch(e){} }
  STAFF_BOOTED = false;
  CURRENT_ROLE = null;
  CURRENT_USER = null;
  ACTIVE_VIEW  = null;
}

    <div class="font-display font-bold text-lg mb-1">${esc(title)}</div>

  </div>`;
}

async function bootCustomer(token){
  const found = await getDocs(query(col('tables'), where('qrToken', '==', token), limit(1)));

    showOnly('customerView');
    el('custActionBar').classList.add('hidden-view');

    return;

  CURRENT_SESSION = CURRENT_TABLE.currentSession || null;
  el('custTableLabel').textContent = 'Table ' + CURRENT_TABLE.tableNo;
  showOnly('customerView');

  const rest = await getDoc(restRef());
  if(rest.exists()){ applyBranding(rest.data().name); applyLogo(rest.data().logoUrl || null); }

  if(!CURRENT_SESSION){
    el('custActionBar').classList.add('hidden-view');
    el('menuRoot').innerHTML = errorPanel('This table is not open yet', 'Check in with a staff member and they will start your table.');

function wireCallButtons(){
  async function sendCall(type){
    if(!requireOnline()) return;
    const live = await getDoc(docIn('tables', CURRENT_TABLE.id));
    if(!live.exists() || live.data().currentSession !== CURRENT_SESSION){
      showToast('This table session has ended', 'error'); return;
    }
    const ref = await addDoc(col('calls'), {
      tableId: CURRENT_TABLE.id, tableNo: CURRENT_TABLE.tableNo,
      type, status: 'open', createdAt: serverTimestamp()
    });
    MY_CALLS.push({ id: ref.id, type, status: 'open' });
    watchMyCalls();
    renderMyRequests();
    showToast('Staff notified', 'success');
  }
  el('btnCallCutlery').addEventListener('click', () => sendCall('cutlery'));
  el('btnCallWaiter').addEventListener('click', () => sendCall('waiter'));
  el('btnCallWater').addEventListener('click', () => el('waterChoice').classList.toggle('hidden-view'));
  document.querySelectorAll('.water-opt').forEach(b => b.addEventListener('click', () => {
    sendCall(b.dataset.water);

  }));
}

const CALL_LABELS_CUST = { water_normal:'Water', water_cold:'Cold water', cutlery:'Cutlery', waiter:'Waiter' };
let callsUnsub = null;
function watchMyCalls(){
  if(callsUnsub) return;   // one listener per table, however many requests are sent
  callsUnsub = onSnapshot(query(col('calls'), where('tableId', '==', CURRENT_TABLE.id)), (snap) => {
    snap.docChanges().forEach(chg => {
      const local = MY_CALLS.find(c => c.id === chg.doc.id);
      if(!local) return;
      const fresh = chg.doc.data();
      if(local.status !== 'resolved' && fresh.status === 'resolved'){
        showToast((CALL_LABELS_CUST[fresh.type] || 'Your request') + ' is on the way', 'success');
        setTimeout(() => { MY_CALLS = MY_CALLS.filter(c => c.id !== local.id); renderMyRequests(); }, 4000);
      }
      local.status = fresh.status;
    });
    renderMyRequests();
  });
  UNSUBS.push(callsUnsub);
}
function renderMyRequests(){
  const node = el('myRequests');
  if(MY_CALLS.length === 0){ node.classList.add('hidden-view'); node.innerHTML = ''; return; }
  node.classList.remove('hidden-view');
  node.innerHTML = MY_CALLS.map(c => `
    <div class="flex items-center justify-between text-xs">
      <span class="font-medium">${esc(CALL_LABELS_CUST[c.type] || c.type)}</span>
      <span class="font-semibold ${c.status === 'resolved' ? 'text-basil' : 'text-saffrond'}">${c.status === 'resolved' ? 'Served' : 'Requested…'}</span>
    </div>`).join('');
}

async function fetchMenu(){
  const [catSnap, itemSnap, addonSnap] = await Promise.all([
    getDocs(col('categories')), getDocs(col('menuItems')), getDocs(col('addons'))
  ]);
  MENU_CATS  = catSnap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => (a.sortOrder ?? 999) - (b.sortOrder ?? 999));
  MENU_ITEMS = itemSnap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => String(a.name).localeCompare(String(b.name)));
  ADDONS     = addonSnap.docs.map(d => ({ id:d.id, ...d.data() }));
  resetStaleSoldCounts();
}

// soldToday used to grow forever, so a dish with a daily limit stayed sold out
// the next morning. Anything counted on an earlier date is cleared on load.
async function resetStaleSoldCounts(){
  const today = new Date().toISOString().slice(0, 10);
  const stale = MENU_ITEMS.filter(i => (i.soldToday || 0) > 0 && i.soldDate !== today);
  if(stale.length === 0) return;
  try{
    const batch = writeBatch(db);
    stale.forEach(i => { batch.update(docIn('menuItems', i.id), { soldToday: 0, soldDate: today }); i.soldToday = 0; i.soldDate = today; });
    await batch.commit();
  } catch(e){ /* customers cannot write here; staff will clear it */ }
}

function isSoldOut(i){
  if(i.available === false) return true;
  if(!i.dailyLimit) return false;
  return (i.soldToday || 0) >= i.dailyLimit;
}

function addToCart(target, item, qty, spice, addons, notes){

  const match = cart.find(c =>
    c.menuItemId === item.id && c.spiceLevel === (spice || null) &&
    c.notes === (notes || null) && JSON.stringify(c.addons) === JSON.stringify(addonNames));
  if(match) match.qty += qty;
  else cart.push({
    menuItemId: item.id, name: item.name, price: unitPrice, qty,
    spiceLevel: spice || null, addons: addonNames, notes: notes || null,
    categoryId: item.categoryId || null

function getRecommendations(){
  const inCart = new Set(CART.map(c => c.menuItemId));
  const pool = MENU_ITEMS.filter(i => !inCart.has(i.id) && !isSoldOut(i));
  const byKeyword = (kw) => {
    const cat = MENU_CATS.find(c => String(c.name).toLowerCase().includes(kw));
    return cat ? pool.filter(i => i.categoryId === cat.id) : [];
  };
  const picks = [];
  const drink = byKeyword('drink').concat(byKeyword('beverage'), byKeyword('mocktail'))[0];
  const sweet = byKeyword('dessert').concat(byKeyword('sweet'))[0];
  if(drink) picks.push(drink);
  if(sweet && !picks.some(p => p.id === sweet.id)) picks.push(sweet);
  for(const c of pool){ if(picks.length >= 2) break; if(!picks.some(p => p.id === c.id)) picks.push(c); }
  return picks.slice(0, 2);
}

/* =========================================================
   7. PLACING ORDERS  (one path used by customers and by staff)
   ========================================================= */
function buildItems(cart, mode){
  if(mode === 'course'){
    const order = MENU_CATS.map(c => c.id);
    const sorted = [...cart].sort((a,b) => order.indexOf(a.categoryId) - order.indexOf(b.categoryId));
    const first = order.indexOf(sorted[0]?.categoryId);
    return sorted.map(c => {
      const round = Math.max(1, order.indexOf(c.categoryId) - first + 1);
      return { id: uid(), menuItemId:c.menuItemId, name:c.name, price:c.price, qty:c.qty,
        status: round === 1 ? 'new' : 'held', round,
        spiceLevel:c.spiceLevel || null, addons:c.addons || [], notes:c.notes || null };
    });
  }
  return cart.map(c => ({ id: uid(), menuItemId:c.menuItemId, name:c.name, price:c.price, qty:c.qty,
    status:'new', round:1, spiceLevel:c.spiceLevel || null, addons:c.addons || [], notes:c.notes || null }));
}

async function findOpenOrder(sessionId){
  const snap = await getDocs(query(col('orders'), where('sessionId', '==', sessionId), where('open', '==', true)));
  if(snap.empty) return null;
  const docs = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => toMillis(b.createdAt) - toMillis(a.createdAt));
  return docs[0];
}

async function bumpSoldCounts(cart){
  const today = new Date().toISOString().slice(0, 10);
  const batch = writeBatch(db);
  const merged = {};
  cart.forEach(c => { merged[c.menuItemId] = (merged[c.menuItemId] || 0) + c.qty; });
  // increment() is applied server-side, so two tables ordering the last portion
  // at the same moment can no longer overwrite each other's count.
  for(const [id, qty] of Object.entries(merged)){
    const local = MENU_ITEMS.find(i => i.id === id);
    if(local && local.soldDate !== today) batch.update(docIn('menuItems', id), { soldToday: qty, soldDate: today });
    else batch.update(docIn('menuItems', id), { soldToday: increment(qty), soldDate: today });
  }
  try{ await batch.commit(); } catch(e){ /* count is advisory, never block the order */ }
}

async function placeOrder({ table, sessionId, cart, mode, placedBy }){
  const items = buildItems(cart, mode);
  const existing = await findOpenOrder(sessionId);

  if(existing){
    await updateDoc(docIn('orders', existing.id), {
      items: [...(existing.items || []), ...items],
      updatedAt: serverTimestamp()
    });
  } else {
    await addDoc(col('orders'), {
      tableId: table.id, tableNo: table.tableNo, sessionId,
      items, status:'active', open:true,
      paymentStatus:'unpaid', paymentMethod:null,
      billRequested:false, billRequestedAt:null,
      placedBy, createdAt: serverTimestamp(), updatedAt: serverTimestamp()
    });
  }
  await updateDoc(docIn('tables', table.id), { status:'occupied' });
  await bumpSoldCounts(cart);
  return !existing;
}

async function submitCustomerOrder(mode){
  if(CART.length === 0 || !requireOnline()) return;
  const msg = el('custMsg');
  clearMsg(msg);

  const live = await getDoc(docIn('tables', CURRENT_TABLE.id));
  if(!live.exists() || live.data().currentSession !== CURRENT_SESSION){
    showMsg(msg, 'This table session has ended. Ask a staff member to start it again.', 'error');
    el('cartDrawer').classList.add('hidden-view');
    return;
  }

  const btn = el('placeOrderBtn');
  btn.disabled = true;
  try{

/* ---------- live order status for the customer ---------- */
let FEEDBACK_DRAWN_FOR = null;
function watchMyOrder(){
  const unsub = onSnapshot(query(col('orders'), where('sessionId', '==', CURRENT_SESSION)), (snap) => {
    const orders = snap.docs.map(d => ({ id:d.id, ...d.data() }))
      .filter(o => o.status !== 'cancelled')
      .sort((a,b) => toMillis(b.createdAt) - toMillis(a.createdAt));
    renderOrderStatus(orders[0]);
  });
  UNSUBS.push(unsub);
}

function renderOrderStatus(order){
  const bar = el('orderStatusBar');
  if(!order){ bar.classList.add('hidden-view'); return; }

  if(order.paymentStatus === 'paid'){
    const key = 'hs_feedback_' + order.id;
    if(localStorage.getItem(key)){ bar.classList.add('hidden-view'); return; }
    if(FEEDBACK_DRAWN_FOR !== order.id){
      FEEDBACK_DRAWN_FOR = order.id;
      renderFeedbackPrompt(bar, order, key);
    }
    return;
  }
  FEEDBACK_DRAWN_FOR = null;

  const all     = order.items || [];
  const visible = all.filter(i => i.status !== 'held');
  const held    = all.filter(i => i.status === 'held');
  const allServed = visible.length > 0 && visible.every(i => i.status === 'served');
  bar.classList.remove('hidden-view');

  if(allServed && held.length > 0){
    const nextRound = Math.min(...held.map(i => i.round));
    const nextItems = held.filter(i => i.round === nextRound);
    bar.innerHTML = `<div class="max-w-2xl mx-auto flex items-center justify-between gap-3">
      <div class="text-sm min-w-0">
        <div class="font-semibold">This course is served</div>
        <div class="text-cream/60 text-xs truncate">${nextItems.map(i => `${i.qty}× ${esc(i.name)}`).join(', ')} ready to go in</div>
      </div>
      <button id="fireNextBtn" class="scale-tap bg-saffron text-white text-xs font-bold px-4 py-2.5 rounded-full whitespace-nowrap shrink-0">Send next course</button>
    </div>`;
    el('fireNextBtn').addEventListener('click', async () => {
      if(!requireOnline()) return;
      const items = all.map(i => (i.status === 'held' && i.round === nextRound) ? { ...i, status:'new' } : i);
      await updateDoc(docIn('orders', order.id), { items, updatedAt: serverTimestamp() });
    });
    return;
  }

  const done = visible.length > 0 && visible.every(i => i.status === 'served');
  bar.innerHTML = `<div class="max-w-2xl mx-auto flex items-center justify-between gap-3">
    <div class="text-sm min-w-0">
      <div class="font-semibold">${done ? 'Everything is served' : 'Your order is with the kitchen'}</div>
      <div class="text-cream/60 text-xs truncate">${visible.map(i => `${i.qty}× ${esc(i.name)} (${esc(i.status)})`).join(' · ')}${held.length ? ` · ${held.length} queued` : ''}</div>
    </div>
    ${order.billRequested
      ? `<span class="text-xs text-cream/60 whitespace-nowrap shrink-0">Bill requested</span>`
      : `<button id="requestBillBtn" class="scale-tap bg-saffron text-white text-xs font-bold px-4 py-2.5 rounded-full whitespace-nowrap shrink-0">Ask for the bill</button>`}
  </div>`;

  const billBtn = el('requestBillBtn');
  if(billBtn) billBtn.addEventListener('click', async () => {
    if(!requireOnline()) return;
    billBtn.disabled = true;
    await updateDoc(docIn('orders', order.id), { billRequested:true, billRequestedAt: serverTimestamp() });
    await updateDoc(docIn('tables', order.tableId), { status:'bill_requested' });
  });
}

function renderFeedbackPrompt(bar, order, key){
  let stars = 0;
  bar.classList.remove('hidden-view');
  function draw(){
    bar.innerHTML = `<div class="max-w-2xl mx-auto">
      <div class="font-semibold text-sm mb-2">How was your meal?</div>
      <div class="flex gap-1.5 mb-2">
        ${[1,2,3,4,5].map(n => `<button data-star="${n}" class="star-btn text-2xl ${n <= stars ? 'text-saffron' : 'text-white/25'}" aria-label="${n} stars"><i class="fa-solid fa-star"></i></button>`).join('')}
      </div>
      <textarea id="fbComment" rows="1" placeholder="Tell us more (optional)" class="w-full bg-white/10 rounded-xl px-3 py-2 text-sm text-cream placeholder-cream/40 mb-2">${esc(bar.querySelector('#fbComment')?.value || '')}</textarea>
      <div class="flex gap-2">
        <button id="fbSubmit" class="scale-tap flex-1 bg-saffron text-ink text-sm font-bold py-2.5 rounded-full">Send feedback</button>
        <button id="fbSkip" class="scale-tap text-cream/50 text-xs font-semibold px-3">Not now</button>
      </div>
    </div>`;
    bar.querySelectorAll('.star-btn').forEach(b => b.addEventListener('click', () => { stars = Number(b.dataset.star); draw(); }));
    el('fbSkip').addEventListener('click', () => { localStorage.setItem(key, '1'); bar.classList.add('hidden-view'); });
    el('fbSubmit').addEventListener('click', async () => {
      if(!requireOnline()) return;
      await addDoc(col('feedback'), {
        orderId: order.id, tableNo: order.tableNo,
        stars: stars || 5, comment: el('fbComment').value.trim() || null,
        createdAt: serverTimestamp()
      });
      localStorage.setItem(key, '1');
      bar.innerHTML = `<div class="max-w-2xl mx-auto text-center text-sm font-semibold">Thank you — see you again soon.</div>`;
      setTimeout(() => bar.classList.add('hidden-view'), 2500);
    });
  }
  draw();
}

let LIVE_ORDERS = [], LIVE_CALLS = [], LIVE_TABLES = [];
let PREV_NEW_ITEMS = null, PREV_CALLS = null, PREV_READY = null;

function startLiveData(){
  UNSUBS.push(onSnapshot(query(col('orders'), where('open', '==', true)), (snap) => {
    LIVE_ORDERS = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => toMillis(a.createdAt) - toMillis(b.createdAt));
    onLiveChange();
  }, (err) => showMsg(el('staffMsg'), 'Orders feed error: ' + err.message, 'error')));

  UNSUBS.push(onSnapshot(query(col('calls'), where('status', '==', 'open')), (snap) => {
    LIVE_CALLS = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => toMillis(a.createdAt) - toMillis(b.createdAt));
    onLiveChange();
  }));

  UNSUBS.push(onSnapshot(col('tables'), (snap) => {
    LIVE_TABLES = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => Number(a.tableNo) - Number(b.tableNo));
    onLiveChange();
  }));

  UNSUBS.push(onSnapshot(col('menuItems'), (snap) => {
    MENU_ITEMS = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => String(a.name).localeCompare(String(b.name)));
    if(ACTIVE_VIEW === 'pos') renderPos();
  }));
}

// Walkout risk is worked out here, on the fly, from the bill time. The old build
// had every signed-in device racing to write an `unpaid_alert` status to the same
// table row; nothing was gained by storing it.
function isWalkoutRisk(order){
  if(order.paymentStatus !== 'unpaid' || !order.billRequested || !order.billRequestedAt) return false;
  return (Date.now() - toMillis(order.billRequestedAt)) >= WALKOUT_MINS * 60000;
}
function minutesLeft(order){
  const mins = WALKOUT_MINS - (Date.now() - toMillis(order.billRequestedAt)) / 60000;
  return Math.max(0, Math.ceil(mins));
}

function onLiveChange(){
  const newItems = LIVE_ORDERS.reduce((s,o) => s + (o.items || []).filter(i => i.status === 'new').length, 0);
  const ready    = LIVE_ORDERS.reduce((s,o) => s + (o.items || []).filter(i => i.status === 'ready').length, 0);
  if(PREV_NEW_ITEMS !== null && newItems > PREV_NEW_ITEMS){ playChime('order'); showToast('New kitchen ticket', 'info'); }
  if(PREV_CALLS !== null && LIVE_CALLS.length > PREV_CALLS){ playChime('call'); showToast('New floor request', 'warning'); }
  PREV_NEW_ITEMS = newItems; PREV_CALLS = LIVE_CALLS.length; PREV_READY = ready;

  el('kitchenAlertDot').classList.toggle('hidden', newItems === 0);
  el('managerAlertDot').classList.toggle('hidden', LIVE_CALLS.length + ready === 0);
  el('counterAlertDot').classList.toggle('hidden', !LIVE_ORDERS.some(isWalkoutRisk));

  renderActiveView();
}
setInterval(() => { if(ACTIVE_VIEW === 'counter' || ACTIVE_VIEW === 'manager') renderActiveView(); }, 30000);

function renderActiveView(){
  if(ACTIVE_VIEW === 'kitchen') renderKitchen();
  if(ACTIVE_VIEW === 'tables')  renderTables();
  if(ACTIVE_VIEW === 'manager') renderManager();
  if(ACTIVE_VIEW === 'counter') renderCounter();
  if(ACTIVE_VIEW === 'pos')     renderPos();
}

function renderKitchen(){
  const root = el('kitchenRoot');
  const tickets = LIVE_ORDERS.filter(o => o.status === 'active' && (o.items || []).some(i => i.status !== 'served' && i.status !== 'held'));

  if(tickets.length === 0){
    root.innerHTML = `<div class="text-center py-20">
      <div class="font-display font-bold text-xl mb-1">All caught up</div>
      <div class="text-sm text-ink/40">New tickets appear here the moment an order lands.</div>
    </div>`;
    return;
  }

  root.innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">${tickets.map(o => {
    const mins = Math.floor((Date.now() - toMillis(o.createdAt)) / 60000);
    const late = mins >= 15;
    return `<article class="bg-white rounded-2xl border ${late ? 'border-chili' : 'border-ink/10'} p-4">
      <div class="flex justify-between items-center mb-3">
        <div class="flex items-center gap-2">
          <span class="font-display font-bold text-lg">Table ${esc(String(o.tableNo ?? '—'))}</span>
          ${o.placedBy?.mode === 'staff' ? `<span class="text-[10px] font-bold bg-ink/10 text-ink/60 px-2 py-0.5 rounded-full">Taken by staff</span>` : ''}
        </div>
        <span class="text-xs font-mono-num ${late ? 'text-chili font-bold' : 'text-ink/40'}">${mins}m</span>
      </div>
      <div class="space-y-2">
        ${(o.items || []).filter(i => i.status !== 'held').map(i => {
          const meta = [i.spiceLevel, (i.addons || []).join(', '), i.notes].filter(Boolean).join(' • ');
          const done = i.status === 'ready' || i.status === 'served';
          return `<div class="flex items-center justify-between gap-2 rounded-xl px-3 py-2 ${done ? 'bg-basil/10' : 'bg-parchment/70'}">
            <div class="min-w-0">
              <div class="text-sm font-medium ${done ? 'text-ink/50' : ''}">${i.qty}× ${esc(i.name)}</div>
              ${meta ? `<div class="text-[11px] text-chili font-medium">${esc(meta)}</div>` : ''}
            </div>
            ${done
              ? `<span class="text-[11px] font-bold text-basil shrink-0">${i.status === 'ready' ? 'Ready' : 'Served'}</span>`
              : `<button class="advance-item scale-tap text-xs font-bold px-3 py-1.5 rounded-full shrink-0 ${i.status === 'new' ? 'bg-chili text-white' : 'bg-saffron text-white'}"
                   data-order="${escAttr(o.id)}" data-item="${escAttr(i.id)}" data-status="${escAttr(i.status)}">${i.status === 'new' ? 'Start' : 'Mark ready'}</button>`}
          </div>`;
        }).join('')}
      </div>
    </article>`;
  }).join('')}</div>`;

  const NEXT = { new:'preparing', preparing:'ready' };
  root.querySelectorAll('.advance-item').forEach(btn => btn.addEventListener('click', () => {
    btn.disabled = true;
    setItemStatus(btn.dataset.order, btn.dataset.item, NEXT[btn.dataset.status]);
  }));
}

    </section>

    <section class="mb-7">
      <h2 class="font-display font-bold text-xl mb-3">Ready to take out</h2>

        <div class="bg-white rounded-2xl border border-basil p-4 flex items-center justify-between gap-2">
          <div class="min-w-0">
            <div class="font-display font-bold">Table ${esc(String(order.tableNo ?? '—'))}</div>

          </div>
          <button class="deliver-item scale-tap bg-saffron text-white text-xs font-bold px-3 py-2 rounded-full shrink-0" data-order="${escAttr(order.id)}" data-item="${escAttr(item.id)}">Delivered</button>

  root.querySelectorAll('.resolve-call').forEach(b => b.addEventListener('click', async () => {
    if(!requireOnline()) return;
    b.disabled = true;

  root.querySelectorAll('.deliver-item').forEach(b => b.addEventListener('click', () => {

function orderSummaryGrid(orders){
  if(orders.length === 0) return `<p class="text-sm text-ink/40">No open orders.</p>`;
  return `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">${orders.map(o => {
    const items = o.items || [];
    const served = items.length > 0 && items.every(i => i.status === 'served');
    return `<div class="bg-white rounded-xl border border-ink/10 px-3 py-2.5">
      <div class="flex justify-between items-center mb-1">
        <span class="font-semibold text-sm">Table ${esc(String(o.tableNo ?? '—'))}</span>
        <span class="text-[10px] font-bold ${served ? 'text-basil' : 'text-saffrond'}">${served ? 'Served' : 'In progress'}</span>
      </div>
      <div class="text-xs text-ink/50">${items.map(i => `${i.qty}× ${esc(i.name)}`).join(', ')}</div>
    </div>`;
  }).join('')}</div>`;
}

/* =========================================================
   13. COUNTER — billing
   ========================================================= */
function orderTotal(o){ return (o.items || []).reduce((s,i) => s + i.price * i.qty, 0); }

function renderCounter(){
  const root = el('counterRoot');
  const unpaid = LIVE_ORDERS.filter(o => o.paymentStatus === 'unpaid');
  const takings = LIVE_ORDERS.filter(o => o.paymentStatus === 'unpaid').reduce((s,o) => s + orderTotal(o), 0);

  root.innerHTML = `
    <div class="flex items-center justify-between flex-wrap gap-2 mb-1">
      <h1 class="font-display font-bold text-2xl">Counter</h1>
      <span class="text-xs text-ink/40">Walkout alert after ${WALKOUT_MINS} minutes</span>
    </div>
    <p class="text-sm text-ink/50 mb-5"><span class="font-mono-num font-bold text-ink">${money(takings)}</span> outstanding across ${unpaid.length} table${unpaid.length === 1 ? '' : 's'}</p>

    <section class="mb-7">
      <h2 class="font-display font-bold text-lg mb-2">Open orders</h2>
      ${orderSummaryGrid(LIVE_ORDERS.filter(o => o.status === 'active'))}
    </section>

    <h2 class="font-display font-bold text-lg mb-2">To be paid</h2>
    ${unpaid.length === 0 ? `<p class="text-sm text-ink/40 py-4">Everything is settled.</p>` : `
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">${unpaid.map(o => {
      const risk = isWalkoutRisk(o);
      return `<article class="bg-white rounded-2xl border ${risk ? 'border-chili ring-2 ring-chili/25' : 'border-ink/10'} p-4">
        <div class="flex justify-between items-start gap-2 mb-2">
          <div class="font-display font-bold text-lg">Table ${esc(String(o.tableNo ?? '—'))}</div>
          ${risk
            ? `<span class="text-[10px] font-bold text-white bg-chili px-2.5 py-1 rounded-full pulse-badge shrink-0">Unpaid — follow up</span>`
            : o.billRequested ? `<span class="text-[10px] font-bold text-chili bg-chili/10 px-2.5 py-1 rounded-full shrink-0">Bill asked · ${minutesLeft(o)}m</span>` : ''}
        </div>
        <div class="text-xs text-ink/50 mb-3">${(o.items || []).map(i => `${i.qty}× ${esc(i.name)}`).join(', ')}</div>
        <div class="font-mono-num font-bold text-2xl mb-3">${money(orderTotal(o))}</div>
        <div class="flex gap-2">
          <button class="print-bill scale-tap flex-1 bg-ink/10 text-ink text-xs font-bold py-2.5 rounded-full" data-id="${escAttr(o.id)}">Print</button>
          <button class="mark-paid scale-tap flex-1 bg-basil text-white text-xs font-bold py-2.5 rounded-full" data-id="${escAttr(o.id)}" data-method="cash">Cash</button>
          <button class="mark-paid scale-tap flex-1 bg-saffron text-white text-xs font-bold py-2.5 rounded-full" data-id="${escAttr(o.id)}" data-method="upi">UPI</button>
        </div>
        <button class="cancel-order text-[11px] text-chili font-semibold mt-2.5" data-id="${escAttr(o.id)}">Cancel this order</button>
      </article>`;
    }).join('')}</div>`}`;

  root.querySelectorAll('.print-bill').forEach(b => b.addEventListener('click', () => printBill(b.dataset.id)));

  root.querySelectorAll('.mark-paid').forEach(b => b.addEventListener('click', async () => {
    if(!requireOnline()) return;
    b.disabled = true;
    const order = LIVE_ORDERS.find(o => o.id === b.dataset.id);
    await updateDoc(docIn('orders', b.dataset.id), {
      paymentStatus:'paid', status:'paid', open:false,
      paymentMethod: b.dataset.method, paidAt: serverTimestamp(),
      total: orderTotal(order)
    });
    if(order?.tableId) await updateDoc(docIn('tables', order.tableId), { status:'available', currentSession:null });
    showToast('Payment recorded', 'success');
  }));

  root.querySelectorAll('.cancel-order').forEach(b => b.addEventListener('click', async () => {
    if(!requireOnline()) return;
    if(!confirm('Cancel this order? It disappears from the kitchen and is not billed.')) return;
    const order = LIVE_ORDERS.find(o => o.id === b.dataset.id);
    await updateDoc(docIn('orders', b.dataset.id), { status:'cancelled', open:false, cancelledAt: serverTimestamp() });
    if(order?.tableId) await updateDoc(docIn('tables', order.tableId), { status:'available', currentSession:null });
    showToast('Order cancelled', 'warning');
  }));
}

/* =========================================================
   14. TAKE ORDER — staff order entry for guests who cannot scan
   ========================================================= */
let POS_STEP = 'table';       // 'table' | 'menu'
let POS_SEARCH = '';

function renderPos(){
  if(!POS_TABLE) POS_STEP = 'table';
  if(POS_STEP === 'table') return renderPosTablePicker();
  // A kitchen update arriving mid-typing used to redraw this screen and drop the
  // waiter's cursor out of the search box.
  if(document.activeElement?.id === 'posSearch') return;
  const fresh = LIVE_TABLES.find(t => t.id === POS_TABLE.id);
  if(fresh) POS_TABLE = { ...POS_TABLE, ...fresh };
  return renderPosMenu();
}

function renderPosTablePicker(){
  el('posRoot').innerHTML = `
    <h1 class="font-display font-bold text-2xl mb-1">Take an order</h1>
    <p class="text-sm text-ink/50 mb-5">For guests at the counter, on the phone, or anyone who would rather not scan.</p>
    <div class="grid grid-cols-3 sm:grid-cols-5 lg:grid-cols-8 gap-3">
      ${LIVE_TABLES.map(t => {
        const order = LIVE_ORDERS.find(o => o.tableId === t.id && o.open);
        const meta  = STATUS_META[t.status] || STATUS_META.available;
        return `<button class="pos-table scale-tap border rounded-2xl p-3 text-center ${meta.card}" data-id="${escAttr(t.id)}">
          <div class="font-display font-bold text-2xl">${esc(String(t.tableNo))}</div>
          <div class="text-[10px] font-bold text-ink/50 mt-0.5">${order ? 'Has an order' : meta.label}</div>
        </button>`;
      }).join('') || `<p class="text-sm text-ink/40 col-span-full">Add tables under Admin first.</p>`}
    </div>`;

  el('posRoot').querySelectorAll('.pos-table').forEach(btn => btn.addEventListener('click', async () => {
    const t = LIVE_TABLES.find(x => x.id === btn.dataset.id);
    if(!t) return;
    // A guest ordering through staff has usually not been seated, so seat them
    // here rather than making the waiter go to the Tables screen first.
    if(!t.currentSession){
      if(!requireOnline()) return;
      const session = uid();
      await updateDoc(docIn('tables', t.id), { currentSession: session, status:'occupied' });
      POS_TABLE = { ...t, currentSession: session };
      showToast('Table ' + t.tableNo + ' seated', 'success');
    } else {
      POS_TABLE = t;
    }
    POS_CART = [];
    POS_SEARCH = '';
    POS_STEP = 'menu';
    renderPos();
  }));
}

      <div class="min-w-0">

                  <div class="text-xl mb-1">${esc(i.emoji || '🍽️')}</div>

                </button>`;
              }).join('')}
            </div>
          </section>`;

      <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">

          <div class="font-semibold">${count} item${count === 1 ? '' : 's'}</div>
          <div class="text-cream/60 text-xs font-mono-num">${money(POS_CART.reduce((s,c) => s + c.price * c.qty, 0))}</div>
        </div>
        <button id="posReview" class="scale-tap bg-saffron text-ink text-sm font-bold px-5 py-2.5 rounded-full ${count === 0 ? 'opacity-40 pointer-events-none' : ''}">Review and send</button>
      </div>

  el('posBack').addEventListener('click', () => { POS_STEP = 'table'; POS_CART = []; POS_TABLE = null; renderPos(); });

    const at = e.target.selectionStart;
    renderPosMenu();
    const next = el('posSearch');
    next.focus();
    next.setSelectionRange(at, at);
  });
  el('posRoot').querySelectorAll('.pos-item').forEach(btn => btn.addEventListener('click', () => {
    openItemModal(MENU_ITEMS.find(i => i.id === btn.dataset.id), 'pos');

function openPosCart(){
  el('posCartTable').textContent = 'Table ' + POS_TABLE.tableNo;
  renderPosCart();
  el('posCartSheet').classList.remove('hidden-view');
}
el('posCartClose').addEventListener('click', () => el('posCartSheet').classList.add('hidden-view'));
el('posCartOverlay').addEventListener('click', () => el('posCartSheet').classList.add('hidden-view'));

function renderPosCart(){
  const node = el('posCartItems');
  if(POS_CART.length === 0){
    node.innerHTML = `<p class="text-center text-ink/40 py-10 text-sm">Nothing added yet.</p>`;
  } else {
    node.innerHTML = POS_CART.map(cartLine).join('');
    wireCartButtons(node, POS_CART, () => { renderPosCart(); renderPos(); });
  }
  el('posCartTotal').textContent = money(POS_CART.reduce((s,c) => s + c.price * c.qty, 0));

}

el('posSendBtn').addEventListener('click', async () => {
  if(POS_CART.length === 0 || !POS_TABLE || !requireOnline()) return;
  const btn = el('posSendBtn');
  btn.disabled = true;
  try{
    const live = await getDoc(docIn('tables', POS_TABLE.id));
    let session = live.exists() ? live.data().currentSession : null;
    if(!session){
      session = uid();
      await updateDoc(docIn('tables', POS_TABLE.id), { currentSession: session, status:'occupied' });
    }
    await placeOrder({
      table: POS_TABLE, sessionId: session, cart: POS_CART, mode:'all',
      placedBy: { mode:'staff', by: CURRENT_USER?.email || 'staff' }
    });
    POS_CART = [];
    el('posCartSheet').classList.add('hidden-view');
    showToast('Sent to the kitchen', 'success');
    POS_STEP = 'table'; POS_TABLE = null;
    renderPos();
  } catch(e){
    showToast('Could not send: ' + e.message, 'error');
  } finally { btn.disabled = false; }
});

/* =========================================================
   15. ANALYTICS
   ========================================================= */
async function loadAnalytics(){
  const root = el('analyticsRoot');
  root.innerHTML = `<div class="text-center py-16 text-ink/40">Crunching the numbers…</div>`;

  const [paidSnap, fbSnap] = await Promise.all([
    getDocs(query(col('orders'), where('paymentStatus', '==', 'paid'))),
    getDocs(col('feedback'))
  ]);
  const paid = paidSnap.docs.map(d => ({ id:d.id, ...d.data() }));
  const feedback = fbSnap.docs.map(d => d.data());

  const revenue = paid.reduce((s,o) => s + (o.total ?? orderTotal(o)), 0);
  const aov     = paid.length ? revenue / paid.length : 0;
  const avgStar = feedback.length ? (feedback.reduce((s,f) => s + (f.stars || 0), 0) / feedback.length).toFixed(1) : null;

  const cash = paid.filter(o => o.paymentMethod === 'cash').length;
  const upi  = paid.filter(o => o.paymentMethod === 'upi').length;
  const cashPct = Math.round(cash / (cash + upi || 1) * 100);

  const dishes = {};
  paid.forEach(o => (o.items || []).forEach(i => { dishes[i.name] = (dishes[i.name] || 0) + i.qty; }));
  const top = Object.entries(dishes).sort((a,b) => b[1] - a[1]).slice(0, 7);
  const maxDish = top[0]?.[1] || 1;

  const hours = Array(24).fill(0);
  paid.forEach(o => { const t = toMillis(o.createdAt); if(t) hours[new Date(t).getHours()]++; });
  const maxHour = Math.max(1, ...hours);

  const staffTaken = paid.filter(o => o.placedBy?.mode === 'staff').length;

  root.innerHTML = `
    <h1 class="font-display font-bold text-3xl mb-5">Analytics</h1>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
      ${statCard('fa-indian-rupee-sign','Revenue', money(revenue),'text-saffron')}
      ${statCard('fa-receipt','Paid orders', paid.length,'text-basil')}
      ${statCard('fa-chart-simple','Average order', money(Math.round(aov)),'text-ink')}
      ${statCard('fa-star','Rating', avgStar ? avgStar + ' ★' : '—','text-saffrond')}
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
      <div class="bg-white rounded-2xl border border-ink/10 p-5">
        <h2 class="font-display font-bold text-lg mb-4">How guests pay</h2>
        <div class="flex justify-center">
          <div class="w-36 h-36 rounded-full" style="background:conic-gradient(#4C7A5E 0% ${cashPct}%, #E0912F ${cashPct}% 100%)">
            <div class="w-24 h-24 bg-white rounded-full m-6 flex flex-col items-center justify-center">
              <div class="font-mono-num font-bold text-sm">${money(revenue)}</div>
              <div class="text-[9px] text-ink/40">total</div>
            </div>
          </div>
        </div>
        <div class="flex justify-center gap-4 mt-4 text-xs font-semibold">
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-basil"></span>Cash ${cashPct}%</span>
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-saffron"></span>UPI ${100 - cashPct}%</span>
        </div>
        <p class="text-xs text-ink/40 text-center mt-4 pt-4 border-t border-ink/10">${staffTaken} of ${paid.length} orders were taken by staff</p>
      </div>

      <div class="bg-white rounded-2xl border border-ink/10 p-5 lg:col-span-2">
        <h2 class="font-display font-bold text-lg mb-4">What sells</h2>
        <div class="space-y-3">
          ${top.length ? top.map(([name, qty]) => `
            <div>
              <div class="flex justify-between text-xs font-semibold mb-1"><span class="truncate pr-2">${esc(name)}</span><span class="font-mono-num shrink-0">${qty}</span></div>
              <div class="h-2.5 bg-parchment rounded-full overflow-hidden"><div class="h-full bg-saffron rounded-full" style="width:${(qty / maxDish * 100).toFixed(0)}%"></div></div>
            </div>`).join('') : `<p class="text-sm text-ink/40 py-6 text-center">No paid orders yet.</p>`}
        </div>
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-ink/10 p-5 mt-5">
      <h2 class="font-display font-bold text-lg mb-4">When they come in</h2>
      <div class="grid grid-cols-12 sm:grid-cols-24 gap-1">
        ${hours.map((c,h) => `<div>
          <div class="aspect-square rounded" style="background:rgba(224,145,47,${c ? 0.15 + c / maxHour * 0.85 : 0.06})" title="${c} orders at ${h}:00"></div>
          <div class="text-[8px] text-center text-ink/30 mt-0.5 font-mono-num">${h}</div>
        </div>`).join('')}
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-ink/10 p-5 mt-5">
      <h2 class="font-display font-bold text-lg mb-1">Today's prep limits</h2>
      <p class="text-xs text-ink/40 mb-4">A dish stops showing on the menu once it hits its limit. Counts clear overnight.</p>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
        ${MENU_ITEMS.filter(m => m.dailyLimit).map(m => `
          <div class="flex items-center justify-between bg-parchment/60 rounded-xl px-3 py-2.5">
            <span class="text-sm font-medium truncate pr-2">${esc(m.emoji || '')} ${esc(m.name)}</span>
            <div class="flex items-center gap-2 shrink-0">
              <div class="w-20 h-1.5 bg-white rounded-full overflow-hidden"><div class="h-full ${(m.soldToday || 0) >= m.dailyLimit ? 'bg-chili' : 'bg-basil'}" style="width:${Math.min(100, (m.soldToday || 0) / m.dailyLimit * 100).toFixed(0)}%"></div></div>
              <span class="text-[10px] font-mono-num text-ink/40 w-12 text-right">${m.soldToday || 0}/${m.dailyLimit}</span>
            </div>
          </div>`).join('') || `<p class="text-sm text-ink/40">No limits set.</p>`}
      </div>
    </div>`;
}

function statCard(icon, label, value, color){
  return `<div class="bg-white rounded-2xl border border-ink/10 p-4">
    <i class="fa-solid ${icon} ${color} text-lg mb-2"></i>
    <div class="font-mono-num font-bold text-xl leading-tight">${value}</div>
    <div class="text-[11px] text-ink/40 mt-0.5">${esc(label)}</div>
  </div>`;
}

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Bill — Table ${escAttr(String(o.tableNo))}</title>

async function refreshCategoryOptions(){
  el('mCategory').innerHTML = `<option value="">No category</option>` +
    MENU_CATS.map(c => `<option value="${escAttr(c.id)}">${esc(c.name)}</option>`).join('');
}

async function refreshMenuAdminList(){
  const node = el('menuAdminList');
  node.innerHTML = MENU_ITEMS.map(i => `
    <div class="flex items-center justify-between gap-2 bg-parchment/60 rounded-xl px-3 py-2 text-sm">
      <span class="truncate ${i.available === false ? 'line-through text-ink/40' : ''}">${esc(i.emoji || '')} ${esc(i.name)}</span>
      <div class="flex items-center gap-2 shrink-0">
        <span class="font-mono-num text-xs">${money(i.price)}</span>
        <button class="toggle-86 scale-tap text-[10px] font-bold px-2 py-1 rounded-full ${i.available === false ? 'bg-chili text-white' : 'bg-basil/10 text-basil'}" data-id="${escAttr(i.id)}" data-on="${i.available !== false}">${i.available === false ? 'Off menu' : 'On menu'}</button>
        <button class="del-item text-chili text-xs" data-id="${escAttr(i.id)}" data-name="${escAttr(i.name)}" aria-label="Delete"><i class="fa-solid fa-trash"></i></button>
      </div>
    </div>`).join('') || `<p class="text-ink/40 text-sm">No dishes yet.</p>`;

  node.querySelectorAll('.toggle-86').forEach(b => b.addEventListener('click', async () => {
    const on = b.dataset.on === 'true';
    await updateDoc(docIn('menuItems', b.dataset.id), { available: !on });
    await fetchMenu(); refreshMenuAdminList();
    showToast(on ? 'Taken off the menu' : 'Back on the menu', on ? 'warning' : 'success');
  }));
  node.querySelectorAll('.del-item').forEach(b => b.addEventListener('click', async () => {
    if(!confirm(`Delete ${b.dataset.name}? Past orders keep their record.`)) return;
    await deleteDoc(docIn('menuItems', b.dataset.id));
    await fetchMenu(); refreshMenuAdminList();
  }));
}

function tableUrl(t){ return `${location.origin}${location.pathname}?table=${t.qrToken}`; }

async function refreshTablesList(){
  const node = el('tablesList');
  if(!node) return;
  node.innerHTML = LIVE_TABLES.map(t => `
    <div class="bg-parchment/60 rounded-2xl p-3">
      <div class="flex items-center justify-between mb-2">
        <span class="font-display font-bold">Table ${esc(String(t.tableNo))}</span>
        <button class="del-table text-chili text-xs" data-id="${escAttr(t.id)}" data-no="${escAttr(String(t.tableNo))}" aria-label="Delete"><i class="fa-solid fa-trash"></i></button>
      </div>
      <div class="qr-slot bg-white rounded-xl p-2 flex justify-center mb-2" data-url="${escAttr(tableUrl(t))}"></div>
      <button class="copy-link w-full text-[11px] font-bold text-saffrond" data-url="${escAttr(tableUrl(t))}">Copy link</button>
    </div>`).join('') || `<p class="text-ink/40 text-sm">No tables yet.</p>`;

  node.querySelectorAll('.qr-slot').forEach(slot => {
    try{ new QRCode(slot, { text: slot.dataset.url, width:120, height:120, colorDark:'#211B14', colorLight:'#ffffff' }); }
    catch(e){ slot.textContent = 'QR unavailable'; }
  });
  node.querySelectorAll('.copy-link').forEach(b => b.addEventListener('click', async () => {
    try{ await navigator.clipboard.writeText(b.dataset.url); b.textContent = 'Copied'; }
    catch(e){ b.textContent = 'Copy failed'; }
    setTimeout(() => b.textContent = 'Copy link', 1500);
  }));
  node.querySelectorAll('.del-table').forEach(b => b.addEventListener('click', async () => {
    if(!confirm(`Delete table ${b.dataset.no}? Its QR code stops working.`)) return;
    await deleteDoc(docIn('tables', b.dataset.id));
    setTimeout(refreshTablesList, 400);
  }));
}

function printAllQr(){
  const w = window.open('', '_blank');
  if(!w){ showToast('Allow pop-ups to print QR codes', 'error'); return; }
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Table QR codes</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>
  <style>body{font-family:sans-serif;padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .c{border:1px dashed #999;border-radius:12px;padding:12px;text-align:center;page-break-inside:avoid}
  h2{margin:0 0 8px;font-size:16px}.q{display:flex;justify-content:center}</style></head><body>
  ${LIVE_TABLES.map(t => `<div class="c"><h2>Table ${escAttr(String(t.tableNo))}</h2><div class="q" data-u="${escAttr(tableUrl(t))}"></div><p style="font-size:10px;color:#666">Scan to see the menu</p></div>`).join('')}
  <scr` + `ipt>window.onload=function(){document.querySelectorAll('.q').forEach(function(d){new QRCode(d,{text:d.dataset.u,width:150,height:150});});setTimeout(function(){window.print();},600);}<\/scr` + `ipt>
  </body></html>`);
  w.document.close();
}

async function refreshMembersList(){
  const node = el('membersList');
  if(!node) return;
  try{
    const snap = await getDocs(col('members'));
    node.innerHTML = snap.docs.map(d => `
      <div class="flex items-center justify-between bg-parchment/60 rounded-xl px-3 py-2 text-sm">
        <div class="min-w-0">
          <div class="font-medium truncate">${esc(d.data().email || d.id)}</div>
          <div class="text-[10px] text-ink/40 font-mono-num truncate">${esc(d.id)}</div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <span class="text-[10px] font-bold bg-ink/10 px-2 py-1 rounded-full">${esc(d.data().role)}</span>
          ${d.id === CURRENT_USER?.uid ? '' : `<button class="del-member text-chili text-xs" data-id="${escAttr(d.id)}" aria-label="Remove"><i class="fa-solid fa-trash"></i></button>`}
        </div>
      </div>`).join('') || `<p class="text-ink/40 text-sm">No team members yet.</p>`;
    node.querySelectorAll('.del-member').forEach(b => b.addEventListener('click', async () => {
      if(!confirm('Remove this person\'s access?')) return;
      await deleteDoc(docIn('members', b.dataset.id));
      refreshMembersList();
    }));
  } catch(e){ node.innerHTML = `<p class="text-ink/40 text-sm">Only admins can view the team list.</p>`; }
}

async function refreshFeedbackList(){
  const node = el('feedbackList');
  if(!node) return;
  const snap = await getDocs(col('feedback'));
  const list = snap.docs.map(d => d.data()).sort((a,b) => toMillis(b.createdAt) - toMillis(a.createdAt)).slice(0, 40);
  node.innerHTML = list.map(f => `
    <div class="bg-parchment/60 rounded-xl px-3 py-2.5">
      <div class="flex items-center justify-between">
        <span class="text-sm font-semibold">Table ${esc(String(f.tableNo ?? '—'))}</span>
        <span class="text-saffrond text-sm">${'★'.repeat(f.stars || 0)}${'☆'.repeat(Math.max(0, 5 - (f.stars || 0)))}</span>
      </div>
      ${f.comment ? `<div class="text-xs text-ink/60 mt-1">${esc(f.comment)}</div>` : ''}
      <div class="text-[10px] text-ink/40 mt-1">${toMillis(f.createdAt) ? new Date(toMillis(f.createdAt)).toLocaleString([], { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }) : ''}</div>
    </div>`).join('') || `<p class="text-ink/40 text-sm">No feedback yet.</p>`;
}

/* ---------- storage ---------- */
async function uploadAsset(file, folder){
  try{
    if(file.size > 5 * 1024 * 1024){ showToast('Pick an image under 5 MB', 'error'); return null; }
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = `${folder}/${RESTAURANT_ID}/${Date.now()}.${ext}`;
    const ref = sRef(storage, path);
    await uploadBytes(ref, file);
    return await getDownloadURL(ref);
  } catch(e){ showToast('Upload failed: ' + e.message, 'error'); return null; }
}
