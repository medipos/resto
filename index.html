            ${done
              ? `<span class="text-[10px] font-bold px-2 py-1 rounded-full shrink-0 ${st.cls}"><i class="fa-solid ${st.icon} mr-1"></i>${st.label}</span>`
              : `<button class="advance-item scale-tap text-xs font-bold px-3 py-1.5 rounded-full shrink-0 ${i.status === 'new' ? 'bg-chili text-white' : 'bg-saffron text-white'}"
                   data-order="${escAttr(o.id)}" data-item="${escAttr(i.id)}" data-status="${escAttr(i.status)}">${i.status === 'new' ? 'Start' : 'Mark ready'}</button>`}
          </div>`;
        }).join('')}
      </div>
    </article>`;
  }).join('')}</div>`;

  const NEXT = { new:'preparing', preparing:'ready' };
  root.querySelectorAll('.advance-item').forEach(btn => btn.addEventListener('click', () => {
    btn.disabled = true;
    setItemStatus(btn.dataset.order, btn.dataset.item, NEXT[btn.dataset.status]);
  }));
}

/* =========================================================
   11. TABLES
   ========================================================= */
// A table's status is worked out from its live order, exactly as parcel slots are.
// It used to be a field staff set by hand, so a table could sit there labelled
// "Bill asked" with no order behind it - which is precisely why its sheet had
// nothing useful to offer. Reserved is the one genuinely manual state, so it
// stays a flag on the table.
const STATUS_META = {
  unpaid:     { label:'Unpaid',     card:'bg-chili/12 border-chili',          dot:'bg-chili',    badge:'bg-chili text-white',          icon:'fa-triangle-exclamation', glow:'glow-red' },
  bill_asked: { label:'Bill asked', card:'bg-saffrond/10 border-saffrond/60', dot:'bg-saffrond', badge:'bg-saffrond/20 text-saffrond', icon:'fa-receipt',              glow:'glow-amber' },
  ordering:   { label:'Ordering',   card:'bg-saffron/10 border-saffron/50',   dot:'bg-saffron',  badge:'bg-saffron/20 text-saffrond',  icon:'fa-utensils',             glow:'' },
  seated:     { label:'Seated',     card:'bg-info/8 border-info/50',          dot:'bg-info',     badge:'bg-info/15 text-info',         icon:'fa-user-group',           glow:'' },
  available:  { label:'Free',       card:'bg-surface border-ink/10',          dot:'bg-ink/15',   badge:'bg-ink/5 text-ink/50',         icon:'fa-chair',                glow:'' },
  reserved:   { label:'Reserved',   card:'bg-violet/10 border-violet/50',     dot:'bg-violet',   badge:'bg-violet/15 text-violet',     icon:'fa-bookmark',             glow:'' },
};
let TABLE_FILTER = '';
let SHEET_TABLE_ID = null;

const TABLE_COLUMNS = ['unpaid', 'bill_asked', 'ordering', 'seated', 'available', 'reserved'];

function tableOrder(t){ return LIVE_ORDERS.find(o => o.tableId === t.id && o.open); }
function tableState(t){
  const order = tableOrder(t);
  if(order){
    if(isWalkoutRisk(order) || order.billSent) return 'unpaid';
    if(order.billRequested) return 'bill_asked';
    return 'ordering';
  }
  if(t.currentSession) return 'seated';
  return t.reserved ? 'reserved' : 'available';
}
function tableMeta(state){ return STATUS_META[state] || STATUS_META.available; }

function tableTile(t, compact){
  const meta = tableMeta(tableState(t));
  return `<button class="table-tile tile tile-sq w-full border rounded-2xl ${meta.card} ${meta.glow}" data-id="${escAttr(t.id)}">
    <span class="tile-strip ${meta.dot}"></span>
    <i class="fa-solid ${meta.icon} text-[10px] text-ink/30 mb-0.5"></i>
    <div class="tile-no font-display font-bold ${compact ? 'text-2xl' : 'text-3xl'}">${esc(String(t.tableNo))}</div>
    <div class="text-[9px] font-bold text-ink/55 leading-tight">${meta.label}</div>
    ${t.currentSession && t.sessionPin
      ? `<div class="text-[10px] font-mono-num font-bold text-saffrond tracking-wider leading-tight">${esc(t.sessionPin)}</div>`
      : t.currentSession ? `<div class="text-[8px] text-basil leading-tight">\u25CF seated</div>` : ''}
  </button>`;
}

function renderTables(){
  const root = el('tablesRoot');
  const counts = {};
  TABLE_COLUMNS.forEach(k => counts[k] = 0);
  LIVE_TABLES.forEach(t => { counts[tableState(t)] = (counts[tableState(t)] || 0) + 1; });

  const chips = [{ k:'', label:'All', n: LIVE_TABLES.length, badge:'bg-ink text-cream' }]
    .concat(TABLE_COLUMNS.map(k => ({ k, label: tableMeta(k).label, n: counts[k] || 0, badge: tableMeta(k).badge })));

  // "All" lays the floor out as a board, most urgent on the left, reserved parked
  // on the right where it will not distract. A single chip drops back to a grid.
  const boardHtml = `<div class="board">
    ${TABLE_COLUMNS.map(k => {
      const meta = tableMeta(k);
      const list = LIVE_TABLES.filter(t => tableState(t) === k);
      return `<div class="board-col">
        <div class="board-head">
          <div class="flex items-center gap-1.5 mb-0.5">
            <span class="w-2 h-2 rounded-full ${meta.dot} shrink-0"></span>
            <span class="text-[11px] font-bold truncate">${esc(meta.label)}</span>
          </div>
          <div class="text-[10px] text-ink/35 font-mono-num">${list.length}</div>
        </div>
        ${list.length
          ? `<div class="board-grid">${list.map(t => tableTile(t, true)).join('')}</div>`
          : `<div class="board-empty text-ink/25">none</div>`}
      </div>`;
    }).join('')}
  </div>`;

  const gridHtml = `<div class="grid grid-cols-3 sm:grid-cols-5 lg:grid-cols-8 gap-3">
    ${LIVE_TABLES.filter(t => tableState(t) === TABLE_FILTER).map(t => tableTile(t, false)).join('')
      || `<p class="text-ink/40 text-sm col-span-full py-6 text-center">No tables in this category.</p>`}
  </div>`;

  root.innerHTML = `
    <div class="flex items-center justify-between flex-wrap gap-2 mb-1">
      <h1 class="font-display font-bold text-2xl">Tables</h1>
      <span class="text-sm font-semibold ${counts.available === 0 ? 'text-chili' : 'text-basil'}">${counts.available} of ${LIVE_TABLES.length} free</span>
    </div>
    <p class="text-xs text-ink/40 mb-3">Tap a table to seat a party, close it, or change its status.</p>
    <div class="flex flex-wrap gap-2 mb-4">
      ${chips.map(c => `<button class="tbl-chip scale-tap badge ${TABLE_FILTER === c.k ? c.badge : 'bg-ink/5 text-ink/50'} px-3 py-1.5" data-k="${escAttr(c.k)}">
        ${esc(c.label)} <span class="font-mono-num opacity-70">${c.n}</span></button>`).join('')}
    </div>
    ${LIVE_TABLES.length === 0
      ? `<p class="text-ink/40 text-sm py-6">No tables yet. Add them under Admin.</p>`
      : (TABLE_FILTER ? gridHtml : boardHtml)}`;

  root.querySelectorAll('.tbl-chip').forEach(b => b.addEventListener('click', () => { TABLE_FILTER = b.dataset.k; renderTables(); }));
  root.querySelectorAll('.table-tile').forEach(btn => btn.addEventListener('click', () => openTableSheet(btn.dataset.id)));
}

function openTableSheet(tableId){
  SHEET_TABLE_ID = tableId;
  const t = LIVE_TABLES.find(x => x.id === tableId);
  if(!t) return;
  const state = tableState(t);
  const meta  = tableMeta(state);
  const order = tableOrder(t);
  const body  = el('tableSheetBody');

  const takeOrder = () => {
    POS_TABLE = t; POS_CART = []; POS_SEARCH = ''; POS_STEP = 'menu'; POS_IS_PARCEL = false;
    closeTableSheet();
    switchStaffView('pos');
  };

  // Only what this table actually needs next. A free table is not offered a
  // discount; a table waiting to pay is not offered a seating button.
  let actions = '';
  if(state === 'available' || state === 'reserved'){
    actions = `
      <button id="tsSeat" class="scale-tap w-full bg-basil text-white font-bold py-3.5 rounded-2xl mb-2">
        <i class="fa-solid fa-user-group mr-1"></i>Seat a new party</button>
      <button id="tsReserve" class="scale-tap w-full border border-ink/15 font-bold py-3 rounded-2xl text-sm">
        ${state === 'reserved' ? 'Remove the reservation' : 'Mark as reserved'}</button>`;
  } else if(state === 'seated'){
    actions = `
      <button id="tsTake" class="scale-tap w-full bg-ink text-cream font-bold py-3.5 rounded-2xl mb-2">
        <i class="fa-solid fa-pen-to-square mr-1"></i>Take an order</button>
      <button id="tsClose" class="scale-tap w-full border border-ink/15 font-bold py-3 rounded-2xl text-sm">
        Close the table</button>`;
  } else {
    actions = `<div id="tsOrder"></div>`;
  }

  body.innerHTML = `
    <div class="flex items-center justify-between mb-1">
      <div class="font-display font-bold text-2xl">Table ${esc(String(t.tableNo))}</div>
      <button id="tsClose2" class="w-8 h-8 rounded-full bg-ink/5 flex items-center justify-center" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="mb-4"><span class="badge ${meta.badge}"><i class="fa-solid ${meta.icon}"></i>${meta.label}</span></div>
    <div id="tsPin"></div>
    <div id="tsGeo"></div>
    ${actions}
    ${order ? `<button id="tsCloseTable" class="w-full text-xs text-ink/40 font-semibold pt-3">Close the table without billing</button>` : ''}`;

  el('tsClose2').addEventListener('click', closeTableSheet);

  // the code, so staff can read it back to a guest who lost it
  const pinBox = el('tsPin');
  if(t.currentSession && t.sessionPin && PIN_REQUIRED){
    pinBox.innerHTML = `<div class="bg-saffron/10 border border-saffron/30 rounded-2xl px-4 py-3 mb-3">
      <div class="text-[11px] font-semibold text-ink/50 mb-1">Table code — read this out to the guests</div>
      <div class="flex items-center gap-3">
        <div class="font-mono-num font-bold text-3xl tracking-[0.2em] flex-1">${esc(t.sessionPin)}</div>
        <button id="tsNewPin" class="scale-tap text-xs font-bold px-3 py-2 rounded-full bg-ink/5">New code</button>
      </div></div>`;
    el('tsNewPin').addEventListener('click', async () => {
      if(!requireOnline()) return;
      const fresh = genPin();
      await updateDoc(docIn('tables', tableId), { sessionPin: fresh });
      showToast('New code: ' + fresh, 'success');
      openTableSheet(tableId);
    });
  }

  // the escape hatch for a guest stuck behind the location check
  const geoBox = el('tsGeo');
  if(GEOFENCE.enabled && t.currentSession){
    geoBox.innerHTML = t.geoOverride
      ? `<div class="bg-basil/10 border border-basil/30 rounded-2xl px-4 py-2.5 flex items-center justify-between gap-2 mb-3">
           <div class="text-xs"><span class="font-bold text-basil">Location check skipped</span></div>
           <button id="tsGeoRevoke" class="scale-tap text-xs font-bold px-3 py-1.5 rounded-full bg-ink/5 shrink-0">Undo</button>
         </div>`
      : `<button id="tsGeoAllow" class="scale-tap w-full border border-ink/15 rounded-2xl px-4 py-2.5 text-left mb-3">
           <div class="text-xs font-bold">Guest stuck on the location check?</div>
           <div class="text-[11px] text-ink/50">Tap to let this table order without it.</div>
         </button>`;
    const allow = el('tsGeoAllow'), revoke = el('tsGeoRevoke');
    if(allow)  allow.addEventListener('click', async () => {
      await updateDoc(docIn('tables', tableId), { geoOverride: true });
      showToast('Location check skipped for this table', 'success');
      openTableSheet(tableId);
    });
    if(revoke) revoke.addEventListener('click', async () => {
      await updateDoc(docIn('tables', tableId), { geoOverride: false });
      openTableSheet(tableId);
    });
  }

  const seat = el('tsSeat');
  if(seat) seat.addEventListener('click', async () => {
    if(!requireOnline()) return;
    const pin = genPin();
    await updateDoc(docIn('tables', tableId), {
      currentSession: uid(), sessionPin: pin, reserved:false, geoOverride:false, status:'occupied'
    });
    closeTableSheet();
    if(PIN_REQUIRED) showSeatedPin(t.tableNo, pin);
    else showToast(`Table ${t.tableNo} is seated`, 'success');
  });

  const reserve = el('tsReserve');
  if(reserve) reserve.addEventListener('click', async () => {
    if(!requireOnline()) return;
    await updateDoc(docIn('tables', tableId), { reserved: state !== 'reserved' });
    showToast(state === 'reserved' ? 'Reservation removed' : `Table ${t.tableNo} reserved`, 'success');
    closeTableSheet();
  });

  const take = el('tsTake');
  if(take) take.addEventListener('click', takeOrder);

  [el('tsClose'), el('tsCloseTable')].forEach(btn => btn && btn.addEventListener('click', async () => {
    if(!requireOnline()) return;
    if(order && order.paymentStatus === 'unpaid' &&
       !confirm(`Table ${t.tableNo} still owes ${money(netTotal(order))}. Close it anyway?`)) return;
    await updateDoc(docIn('tables', tableId), {
      currentSession:null, sessionPin:null, geoOverride:false, reserved:false, status:'available'
    });
    showToast('Table closed', 'success');
    closeTableSheet();
  }));

  const orderBox = el('tsOrder');
  if(orderBox && order){
    orderBox.innerHTML = orderActionsHtml(order, false);
    wireOrderActions(orderBox, order, t, false);
  }

  el('tableStatusSheet').classList.remove('hidden-view');
}
function closeTableSheet(){ el('tableStatusSheet').classList.add('hidden-view'); SHEET_TABLE_ID = null; }
el('tableStatusOverlay').addEventListener('click', closeTableSheet);

/* =========================================================
   12. FLOOR (waiter / manager)
   ========================================================= */
const CALL_LABELS = { water_normal:'Water — normal', water_cold:'Water — chilled', water_bottled:'Water — sealed bottle', cutlery:'Cutlery', waiter:'Waiter called' };

function renderManager(){
  const root = el('managerRoot');
  const ready = [];
  LIVE_ORDERS.filter(o => o.status === 'active').forEach(o => {
    liveItems(o).filter(i => i.status === 'ready').forEach(i => ready.push({ order:o, item:i }));
  });
  const risky = LIVE_ORDERS.filter(isWalkoutRisk);
  // Once the bill is out it belongs to the counter, not the floor.
  const billWanted = LIVE_ORDERS.filter(o => o.billRequested && !o.billSent && o.paymentStatus === 'unpaid')
    .sort((a,b) => toMillis(a.billRequestedAt) - toMillis(b.billRequestedAt));

  root.innerHTML = `
    ${risky.length ? `<div class="bg-chili text-white rounded-2xl px-4 py-3 mb-4 text-sm font-semibold">
      Unpaid past ${WALKOUT_MINS} minutes: ${risky.map(o => 'Table ' + esc(String(o.tableNo))).join(', ')}</div>` : ''}

    <div class="flex flex-wrap gap-3 mb-5 text-[11px] text-ink/50">
      ${Object.values(ITEM_STATUS).map(v => `<span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full ${v.dot}"></span>${v.label}</span>`).join('')}
    </div>

    <section class="mb-7">
      <h2 class="font-display font-bold text-xl mb-3">Requests</h2>
      ${LIVE_CALLS.length ? `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">${LIVE_CALLS.map(c => `
        <div class="bg-surface rounded-2xl border border-chili p-4 flex items-center justify-between gap-2">
          <div class="min-w-0">
            <div class="font-display font-bold">Table ${esc(String(c.tableNo ?? '—'))}</div>
            <div class="text-xs text-ink/50 truncate">${esc(CALL_LABELS[c.type] || c.type)}</div>
          </div>
          <button class="resolve-call scale-tap bg-basil text-white text-xs font-bold px-3 py-2 rounded-full shrink-0" data-id="${escAttr(c.id)}">Done</button>
        </div>`).join('')}</div>`
        : `<p class="text-sm text-ink/40 py-4">Nothing waiting.</p>`}
    </section>

    <section class="mb-7">
      <h2 class="font-display font-bold text-xl mb-3">Ready to take out</h2>
      ${ready.length ? `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">${ready.map(({order, item}) => `
        <div class="bg-surface rounded-2xl border-2 border-basil glow-green p-4 flex items-center justify-between gap-2">
          <div class="min-w-0">
            <div class="font-display font-bold">${esc(spotLabel(order))}</div>
            <div class="text-xs text-ink/50 truncate">${item.qty}× ${esc(item.name)}${item.kind === 'service' ? ' <span class="text-[10px] font-bold text-saffrond">· from counter</span>' : ''}</div>
          </div>
          <button class="deliver-item scale-tap bg-saffron text-white text-xs font-bold px-3 py-2 rounded-full shrink-0" data-order="${escAttr(order.id)}" data-item="${escAttr(item.id)}">Delivered</button>
        </div>`).join('')}</div>`
        : `<p class="text-sm text-ink/40 py-4">Nothing plated yet.</p>`}
    </section>

    <section class="mb-7">
      <h2 class="font-display font-bold text-xl mb-3">Bill requests</h2>
      ${billWanted.length ? `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">${billWanted.map(o => `
        <div class="bg-surface rounded-2xl border ${o.billSent ? 'border-basil' : 'border-saffron'} p-4">
          <div class="flex items-center justify-between mb-1">
            <div class="font-display font-bold">Table ${esc(String(o.tableNo ?? '—'))}</div>
            <div class="font-mono-num font-bold">${money(netTotal(o))}</div>
          </div>
          <div class="text-[11px] text-ink/40 mb-3">${(o.items || []).reduce((s,i) => s + i.qty, 0)} items · asked ${o.billRequestedAt ? Math.max(0, Math.floor((Date.now() - toMillis(o.billRequestedAt)) / 60000)) + 'm ago' : 'just now'}</div>
          <button class="send-bill-floor scale-tap w-full text-xs font-bold py-2.5 rounded-full ${o.billSent ? 'bg-basil/10 text-basil' : 'bg-ink text-cream'}" data-id="${escAttr(o.id)}" ${o.billSent ? 'disabled' : ''}>
            ${o.billSent ? '<i class="fa-solid fa-check mr-1"></i>Sent to table' : '<i class="fa-solid fa-paper-plane mr-1"></i>Send bill to table'}
          </button>
        </div>`).join('')}</div>`
        : `<p class="text-sm text-ink/40 py-4">No one is waiting for a bill.</p>`}
    </section>

    <section>
      <h2 class="font-display font-bold text-lg mb-2">Still cooking</h2>
      ${orderSummaryGrid(inProgressOrders())}
    </section>`;

  root.querySelectorAll('.send-bill-floor').forEach(b => b.addEventListener('click', () => {
    b.disabled = true;
    sendBillToGuest(b.dataset.id);
  }));

  root.querySelectorAll('.resolve-call').forEach(b => b.addEventListener('click', async () => {
    if(!requireOnline()) return;
    b.disabled = true;
    await updateDoc(docIn('calls', b.dataset.id), { status:'resolved', resolvedAt: serverTimestamp() });
  }));
  root.querySelectorAll('.deliver-item').forEach(b => b.addEventListener('click', () => {
    b.disabled = true;
    setItemStatus(b.dataset.order, b.dataset.item, 'served');
  }));
}

// An order with every dish served is finished as far as the kitchen and floor are
// concerned, so it drops off the "open orders" lists and only the counter keeps it.
function inProgressOrders(){
  return LIVE_ORDERS.filter(o => {
    if(o.status !== 'active') return false;
    const items = liveItems(o);
    return items.length > 0 && !items.every(i => i.status === 'served');
  });
}

function orderSummaryGrid(orders){
  if(orders.length === 0) return `<p class="text-sm text-ink/40">No open orders.</p>`;
  return `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">${orders.map(o => {
    const items = o.items || [];
    const served = items.length > 0 && items.every(i => i.status === 'served');
    const tally = ['new','preparing','ready','served','held']
      .map(k => ({ k, n: items.filter(i => i.status === k).length })).filter(x => x.n);
    return `<div class="bg-surface rounded-xl border border-ink/10 px-3 py-2.5">
      <div class="flex justify-between items-center mb-1.5">
        <span class="font-semibold text-sm">${esc(spotLabel(o))}</span>
        <span class="text-[10px] font-bold ${served ? 'text-basil' : 'text-saffrond'}">${served ? 'All served' : 'In progress'}</span>
      </div>
      <div class="flex gap-0.5 h-1.5 rounded-full overflow-hidden mb-1.5">
        ${tally.map(x => `<div class="${ITEM_STATUS[x.k].dot}" style="flex:${x.n}" title="${x.n} ${ITEM_STATUS[x.k].label}"></div>`).join('')}
      </div>
      <div class="text-xs text-ink/50">${items.map(i => `${i.qty}× ${esc(i.name)}`).join(', ')}</div>
    </div>`;
  }).join('')}</div>`;
}

/* =========================================================
   13. COUNTER — billing
   ========================================================= */
// Cancelled lines are kept on the order for the audit trail, but they are not
// billed, not cooked, and not counted anywhere.
function liveItems(o){ return (o.items || []).filter(i => i.status !== 'cancelled'); }
function orderTotal(o){ return liveItems(o).reduce((s,i) => s + i.price * i.qty, 0); }

function renderCounter(){
  const root = el('counterRoot');
  const unpaid = LIVE_ORDERS.filter(o => o.paymentStatus === 'unpaid');
  const takings = LIVE_ORDERS.filter(o => o.paymentStatus === 'unpaid').reduce((s,o) => s + netTotal(o), 0);

  root.innerHTML = `
    <div class="flex items-center justify-between flex-wrap gap-2 mb-1">
      <h1 class="font-display font-bold text-2xl">Counter</h1>
      <span class="text-xs text-ink/40">Walkout alert after ${WALKOUT_MINS} minutes</span>
    </div>
    <p class="text-sm text-ink/50 mb-5"><span class="font-mono-num font-bold text-ink">${money(takings)}</span> outstanding across ${unpaid.length} table${unpaid.length === 1 ? '' : 's'}</p>

    <section class="mb-7">
      <h2 class="font-display font-bold text-lg mb-2">Still cooking</h2>
      ${orderSummaryGrid(inProgressOrders())}
    </section>

    <h2 class="font-display font-bold text-lg mb-2">To be paid</h2>
    ${unpaid.length === 0 ? `<p class="text-sm text-ink/40 py-4">Everything is settled.</p>` : `
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">${unpaid.map(o => {
      const risk = isWalkoutRisk(o);
      return `<article class="bg-surface rounded-2xl border ${risk ? 'border-chili ring-2 ring-chili/25' : 'border-ink/10'} p-4">
        <div class="flex justify-between items-start gap-2 mb-2">
          <div class="font-display font-bold text-lg">${esc(spotLabel(o))}</div>
          ${risk
            ? `<span class="text-[10px] font-bold text-white bg-chili px-2.5 py-1 rounded-full pulse-badge shrink-0">Unpaid — follow up</span>`
            : o.billRequested ? `<span class="text-[10px] font-bold text-chili bg-chili/10 px-2.5 py-1 rounded-full shrink-0">Bill asked · ${minutesLeft(o)}m</span>` : ''}
        </div>
        <div class="text-xs text-ink/50 mb-3">${(o.items || []).map(i => `${i.qty}× ${esc(i.name)}`).join(', ')}</div>
        ${discountAmount(o) ? `<div class="text-xs mb-1">
          <span class="text-ink/40 line-through font-mono-num">${money(orderTotal(o))}</span>
          <span class="text-chili font-semibold ml-1">− ${money(discountAmount(o))}</span>
          <div class="text-[10px] text-ink/40">${esc(o.discount.reason || '')}</div>
        </div>` : ''}
        <div class="font-mono-num font-bold text-2xl mb-3">${money(netTotal(o))}</div>

/* =========================================================
   14a. PARCEL BOXES
   Boxes behave like tables but never take QR orders, so they need no session
   PIN and no seating. The counter owns them end to end.
   ========================================================= */
const PARCEL_STAGES = {
  free:      { label:'Free',      badge:'bg-ink/5 text-ink/50',        strip:'bg-ink/15',  card:'bg-surface border-ink/10',       glow:'',            icon:'fa-box-open' },
  taken:     { label:'Order in',  badge:'bg-violet/15 text-violet',    strip:'bg-violet',  card:'bg-violet/8 border-violet/50',   glow:'glow-violet', icon:'fa-receipt' },
  preparing: { label:'Preparing', badge:'bg-saffron/20 text-saffrond', strip:'bg-saffron', card:'bg-saffron/8 border-saffron/50', glow:'',            icon:'fa-fire-burner' },
  ready:     { label:'Packed',    badge:'bg-info/15 text-info',        strip:'bg-info',    card:'bg-info/8 border-info/50',       glow:'glow-blue',   icon:'fa-bag-shopping' },
  unpaid:    { label:'Unpaid',    badge:'bg-chili text-white',         strip:'bg-chili',   card:'bg-chili/12 border-chili',       glow:'glow-red',    icon:'fa-triangle-exclamation' },
};
const PARCEL_COLUMNS = ['free', 'taken', 'preparing', 'ready', 'unpaid'];

// Derived from the order, never stored, so a badge cannot drift out of step with
// what the kitchen has actually done.
//
// Payment does NOT free the box on its own. Takeaway is often paid upfront, and
// the earlier version released the box the moment money was taken - so a box
// still holding a cooking order would show as available and be handed to the
// next customer. A box is only free once the food has left the counter.
function parcelStage(order){
  if(!order) return 'free';
  const items = liveItems(order);
  if(items.length === 0) return 'free';
  const handedOver = items.every(i => i.status === 'served');
  if(handedOver) return order.paymentStatus === 'paid' ? 'free' : 'unpaid';
  if(items.some(i => i.status === 'ready'))     return 'ready';
  if(items.some(i => i.status === 'preparing')) return 'preparing';
  return 'taken';
}
function parcelPaidEarly(order){
  return !!order && order.paymentStatus === 'paid' && !liveItems(order).every(i => i.status === 'served');
}
function parcelOrder(box){ return LIVE_ORDERS.find(o => o.tableId === box.id && o.open); }

// Single source of truth for what a spot is called, so a parcel order can never
// print or display as "Table 3".
function isParcelOrder(o){ return o?.orderKind === 'parcel'; }
function spotLabel(o){ return (isParcelOrder(o) ? 'Parcel ' : 'Table ') + (o?.tableNo ?? '—'); }
function boxLabel(b){ return 'Parcel ' + (b?.tableNo ?? '—'); }

function parcelTile(box){
  const o  = parcelOrder(box);
  const st = PARCEL_STAGES[parcelStage(o)];
  const paidEarly = parcelPaidEarly(o);
  return `<button class="parcel-tile tile tile-sq w-full border rounded-2xl ${st.card} ${st.glow}" data-id="${escAttr(box.id)}">
    <span class="tile-strip ${st.strip}"></span>
    <i class="fa-solid ${st.icon} text-[10px] text-ink/30 mb-0.5"></i>
    <div class="tile-no font-display font-bold text-2xl">${esc(String(box.tableNo))}</div>
    <div class="text-[9px] font-bold text-ink/55 leading-tight">${st.label}</div>
    ${o ? `<div class="font-mono-num font-bold text-[10px] leading-tight">${money(netTotal(o))}</div>` : ''}
    ${paidEarly ? `<div class="text-[8px] font-bold text-basil leading-tight"><i class="fa-solid fa-circle-check"></i> paid</div>` : ''}
  </button>`;
}

function todayStr(){ return new Date().toISOString().slice(0, 10); }
function daysAgoStr(n){ const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); }

/* ---------- download helpers ---------- */
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
// Excel opens CSV in the system locale, so quote everything and prefix a BOM
// to keep rupee signs and Marathi/Hindi dish names intact.
function toCsv(headers, rows){
  const cell = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  return '\uFEFF' + [headers.map(cell).join(','), ...rows.map(r => r.map(cell).join(','))].join('\r\n');
}
function exportCsv(headers, rows, filename){
  if(rows.length === 0){ showToast('Nothing to export for this range', 'warning'); return; }
  downloadBlob(new Blob([toCsv(headers, rows)], { type:'text/csv;charset=utf-8;' }), filename);
  showToast('CSV downloaded', 'success');
}
// jsPDF has no table support on its own, so rows are laid out by hand with
// page breaks. Keeps the dependency to a single script.
function exportPdf(title, subtitle, headers, rows, widths, filename){
  if(rows.length === 0){ showToast('Nothing to export for this range', 'warning'); return; }
  const JsPDF = window.jspdf?.jsPDF;
  if(!JsPDF){ showToast('PDF library did not load — check your connection', 'error'); return; }
  const pdf = new JsPDF({ unit:'pt', format:'a4' });
  const left = 40, right = 555;
  let y = 56;

  pdf.setFont('helvetica', 'bold').setFontSize(15).text(title, left, y);
  y += 16;
  pdf.setFont('helvetica', 'normal').setFontSize(9).setTextColor(120)
     .text(subtitle, left, y);
  y += 18;

  const drawHead = () => {
    pdf.setFillColor(33, 27, 20).rect(left, y - 11, right - left, 18, 'F');
    pdf.setFont('helvetica', 'bold').setFontSize(9).setTextColor(255);
    let x = left + 6;
    headers.forEach((h, i) => { pdf.text(String(h), x, y + 1); x += widths[i]; });
    y += 20;
    pdf.setFont('helvetica', 'normal').setTextColor(40);
  };
  drawHead();

  rows.forEach((row, ri) => {
    if(y > 780){ pdf.addPage(); y = 56; drawHead(); }
    if(ri % 2){ pdf.setFillColor(246, 243, 236).rect(left, y - 10, right - left, 16, 'F'); }
    let x = left + 6;
    row.forEach((c, i) => {
      const maxChars = Math.floor(widths[i] / 4.6);
      let text = String(c ?? '');
      if(text.length > maxChars) text = text.slice(0, maxChars - 1) + '…';
      pdf.text(text, x, y);
      x += widths[i];
    });
    y += 16;
  });

  pdf.setFontSize(8).setTextColor(150)
     .text('Generated ' + new Date().toLocaleString(), left, Math.min(y + 18, 800));
  pdf.save(filename);
  showToast('PDF downloaded', 'success');
}

function inRange(ms, from, to){
  if(!ms) return false;
  const d = new Date(ms).toISOString().slice(0, 10);
  return d >= from && d <= to;
}

function filteredBills(){
  const from = el('repFrom').value, to = el('repTo').value;
  const term = el('repSearch').value.trim().toLowerCase();
  return REPORT_BILLS.filter(o => {
    if(!inRange(toMillis(o.paidAt || o.createdAt), from, to)) return false;
    if(REPORT_CHANNEL === 'parcel' && !isParcelOrder(o)) return false;
    if(REPORT_CHANNEL === 'dinein' &&  isParcelOrder(o)) return false;
    if(!term) return true;
    return String(o.tableNo).includes(term) ||
           (o.items || []).some(i => String(i.name).toLowerCase().includes(term));
  });
}
function filteredFeedback(){
  const from = el('repFrom').value, to = el('repTo').value;
  const term = el('repSearch').value.trim().toLowerCase();
  return REPORT_FEEDBACK.filter(f => {
    if(!inRange(toMillis(f.createdAt), from, to)) return false;
    if(!term) return true;
    return String(f.comment || '').toLowerCase().includes(term) || String(f.tableNo).includes(term);
  });
}

  const [paidSnap, fbSnap] = await Promise.all([
    getDocs(query(col('orders'), where('paymentStatus', '==', 'paid'))),
    getDocs(col('feedback'))
  ]);
  const paid = paidSnap.docs.map(d => ({ id:d.id, ...d.data() }));
  const feedback = fbSnap.docs.map(d => d.data());

  const revenue = paid.reduce((s,o) => s + (o.total ?? netTotal(o)), 0);
  const aov     = paid.length ? revenue / paid.length : 0;
  const avgStar = feedback.length ? (feedback.reduce((s,f) => s + (f.stars || 0), 0) / feedback.length).toFixed(1) : null;

  const cash = paid.filter(o => o.paymentMethod === 'cash').length;
  const upi  = paid.filter(o => o.paymentMethod === 'upi').length;
  const cashPct = Math.round(cash / (cash + upi || 1) * 100);

  const dishes = {};
  paid.forEach(o => liveItems(o).forEach(i => { dishes[i.name] = (dishes[i.name] || 0) + i.qty; }));
  const top = Object.entries(dishes).sort((a,b) => b[1] - a[1]).slice(0, 7);
  const maxDish = top[0]?.[1] || 1;

  const hours = Array(24).fill(0);
  paid.forEach(o => { const t = toMillis(o.createdAt); if(t) hours[new Date(t).getHours()]++; });
  const maxHour = Math.max(0, ...hours);

  // squeezing 24 columns in to show 3 a.m. as empty.
  const active = hours.map((c, h) => ({ c, h })).filter(x => x.c > 0);
  const lo = active.length ? Math.max(0, Math.min(...active.map(x => x.h)) - 1) : 8;
  const hi = active.length ? Math.min(23, Math.max(...active.map(x => x.h)) + 1) : 23;
  const serviceHours = hours.map((c, h) => ({ c, h })).filter(x => x.h >= lo && x.h <= hi);
  const busiest = active.length ? active.reduce((a, b) => (b.c > a.c ? b : a)) : null;

  const staffTaken = paid.filter(o => o.placedBy?.mode === 'staff').length;

  const parcelPaid = paid.filter(isParcelOrder);

  const parcelPeak = parcelHours.some(n => n) ? parcelHours.indexOf(Math.max(...parcelHours)) : null;

  const parcelDishes = {};
  parcelPaid.forEach(o => liveItems(o).forEach(i => { parcelDishes[i.name] = (parcelDishes[i.name] || 0) + i.qty; }));
  const topParcel = Object.entries(parcelDishes).sort((a,b) => b[1] - a[1]).slice(0, 5);
  const maxParcelDish = topParcel[0]?.[1] || 1;

  root.innerHTML = `

      ${statCard('fa-indian-rupee-sign','Revenue', money(revenue),'text-saffron')}
      ${statCard('fa-receipt','Paid orders', paid.length,'text-basil')}
      ${statCard('fa-chart-simple','Average order', money(Math.round(aov)),'text-ink')}

const MEAL_PERIODS = [
  { label:'Lunch 11–4',   from:11, to:16 },
  { label:'Evening 4–7',  from:16, to:19 },
  { label:'Dinner 7–12',  from:19, to:24 },
];
function hourLabel(h){
  const ampm = h < 12 ? 'am' : 'pm';
  const base = h % 12 === 0 ? 12 : h % 12;
  return base + ampm;
}

function statCard(icon, label, value, color){
  return `<div class="bg-surface rounded-2xl border border-ink/10 p-4">
    <i class="fa-solid ${icon} ${color} text-lg mb-2"></i>
    <div class="font-mono-num font-bold text-xl leading-tight">${value}</div>
    <div class="text-[11px] text-ink/40 mt-0.5">${esc(label)}</div>
  </div>`;
}

   16. BILL
   ========================================================= */
async function printBill(orderId){
  const [oSnap, rSnap] = await Promise.all([getDoc(docIn('orders', orderId)), getDoc(restRef())]);
  if(!oSnap.exists()){ showToast('Could not load that bill', 'error'); return; }
  const o = oSnap.data();
  const r = rSnap.data() || {};
  const items = liveItems(o);
  const total = orderTotal(o);
  const disc  = discountAmount(o);
  const net   = netTotal(o);
  const count = items.reduce((s, i) => s + i.qty, 0);
  const when  = new Date(toMillis(o.billSentAt || o.createdAt) || Date.now())
                  .toLocaleString([], { dateStyle:'medium', timeStyle:'short' });
  const label = billLabel({ ...o, id: orderId });

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${escAttr(label)} — ${escAttr(spotLabel(o))}</title>
<style>
 *{box-sizing:border-box;}
 body{font-family:'Courier New',monospace;padding:16px;max-width:320px;margin:0 auto;color:#111;}
 .logo{display:block;width:56px;height:56px;object-fit:contain;margin:0 auto 6px;}
 h1{font-size:16px;text-align:center;margin:0 0 3px;letter-spacing:.5px;}
 .sub{text-align:center;font-size:10px;color:#555;white-space:pre-line;line-height:1.35;}
 .meta{display:flex;justify-content:space-between;font-size:10px;color:#666;margin:8px 0;}
 .meta div:last-child{text-align:right;}
 hr{border:none;border-top:1px dashed #999;margin:8px 0;}
 table{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed;}
 th{font-size:9px;text-transform:uppercase;color:#777;font-weight:bold;padding:0 0 4px;}
 td{padding:3px 0;vertical-align:top;}
 .r{text-align:right;}
 .nm{word-wrap:break-word;padding-right:4px;}
 .ad{font-size:9px;color:#777;}
 .tot{display:flex;justify-content:space-between;font-weight:bold;font-size:15px;margin-top:6px;}
 .row{display:flex;justify-content:space-between;font-size:10px;color:#666;margin-top:2px;}
 .pay{text-align:center;font-size:11px;margin-top:10px;padding:6px;border:1px dashed #999;}
 .ft{text-align:center;font-size:9px;color:#999;margin-top:14px;}
 @media print{body{padding:0;} @page{margin:6mm;}}
</style></head><body>
${r.logoUrl ? `<img class="logo" src="${escAttr(r.logoUrl)}" alt="">` : ''}
<h1>${esc(r.name || 'Restaurant')}</h1>
${r.address ? `<div class="sub">${esc(r.address)}</div>` : ''}
<div class="meta">
  <div><strong>${esc(label)}</strong><br>${esc(spotLabel(o))}${isParcelOrder(o) ? ' &middot; TAKEAWAY' : ''}</div>
  <div>${esc(when)}</div>
</div>
<hr>
<table>
  <colgroup><col><col style="width:26px"><col style="width:52px"><col style="width:62px"></colgroup>
  <thead><tr><th style="text-align:left">Item</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amt</th></tr></thead>
  <tbody>
  ${items.map(i => {
    const meta = [i.spiceLevel, (i.addons || []).join(', '), i.notes].filter(Boolean).join(', ');
    return `<tr>
      <td class="nm">${esc(i.name)}${meta ? `<div class="ad">${esc(meta)}</div>` : ''}</td>
      <td class="r">${i.qty}</td>
      <td class="r">${money(i.price)}</td>
      <td class="r">${money(i.price * i.qty)}</td>
    </tr>`;
  }).join('')}
  </tbody>
</table>
<hr>
<div class="row"><span>Items</span><span>${count}</span></div>
<div class="row"><span>Subtotal</span><span>${money(total)}</span></div>
${disc ? `<div class="row"><span>Discount${o.discount?.type === 'percent' ? ` (${esc(String(o.discount.value))}%)` : ''}</span><span>- ${money(disc)}</span></div>` : ''}
<div class="tot"><span>TOTAL</span><span>${money(net)}</span></div>
${o.paymentMethod
  ? `<div class="pay">PAID BY ${esc(String(o.paymentMethod).toUpperCase())}</div>`
  : r.upiId ? `<div class="pay">Pay by UPI<br><strong>${esc(r.upiId)}</strong></div>` : ''}
<div class="ft">This is a computer generated bill.<br>Thank you for dining with us.</div>
<scr` + `ipt>
// Waiting for onload means the logo is actually on the page when the print
// dialog opens; printing straight away produced a bill with a blank square.
window.onload = function(){ setTimeout(function(){ window.print(); }, 350); };
<\/scr` + `ipt>
</body></html>`;

  const w = window.open('', '_blank');
  if(!w){ showToast('Allow pop-ups to print the bill', 'error'); return; }
  w.document.write(html);
  w.document.close();
}

      x.classList.toggle('border-saffron', x.dataset.theme === chosen);
      x.classList.toggle('border-ink/10',  x.dataset.theme !== chosen);

      await setDoc(settingsRef(), { theme: chosen }, { merge:true });

    } catch(e){ showToast('Could not save the theme: ' + e.message, 'error'); }

      el('geoLat').value = pos.coords.latitude.toFixed(6);
      el('geoLng').value = pos.coords.longitude.toFixed(6);
      showMsg(el('geoMsg'), `Pinned to within about ${Math.round(pos.coords.accuracy)} m. Stand inside the restaurant for the best result.`, 'success');
    } catch(e){
      showMsg(el('geoMsg'), e.code === 1 ? 'Location permission was refused for this browser.' : 'Could not get a location fix. Try again near a window.', 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-location-crosshairs mr-1"></i>Use my current location';

  });

  el('saveGeoBtn').addEventListener('click', async () => {
    const lat = parseFloat(el('geoLat').value), lng = parseFloat(el('geoLng').value);

    if(on && (Number.isNaN(lat) || Number.isNaN(lng))){
      showMsg(el('geoMsg'), 'Set the restaurant location before switching the check on.', 'error'); return;
    }
    GEOFENCE = {
      enabled: on, lat: Number.isNaN(lat) ? null : lat, lng: Number.isNaN(lng) ? null : lng,
      radiusM: Math.max(30, Number(el('geoRadius').value || 200)),
      mode: el('geoMode').value
    };

        foodType: el('mFoodType').value || null,

      });

      el('mSpicy').checked = false;
      await fetchMenu();
      refreshMenuAdminList();
      showToast('Dish added', 'success');

    finally { btn.disabled = false; }
  });

  el('addAddonBtn').addEventListener('click', async () => {
    const name = el('addonName').value.trim();
    if(!name) return;
    await addDoc(col('addons'), { name, price: Number(el('addonPrice').value || 0) });
    el('addonName').value = ''; el('addonPrice').value = '';
    await fetchMenu();
    refreshAddonsList();
  });

  el('addTableBtn').addEventListener('click', async () => {
    const no = Number(el('tableNo').value || 0);
    if(!no){ showToast('Enter a table number', 'error'); return; }
    if(LIVE_TABLES.some(t => Number(t.tableNo) === no)){ showToast('That table already exists', 'error'); return; }
    await addDoc(col('tables'), { tableNo: no, status:'available', currentSession:null, qrToken: uid() + uid() });
    el('tableNo').value = '';
    setTimeout(refreshTablesList, 400);
  });

  el('addMemberBtn').addEventListener('click', async () => {
    const uidVal = el('memberUid').value.trim();
    if(!uidVal){ showToast('Paste the user UID', 'error'); return; }
    await setDoc(docIn('members', uidVal), {
      role: el('memberRole').value, email: el('memberEmail').value.trim() || null, addedAt: serverTimestamp()
    });
    el('memberUid').value = ''; el('memberEmail').value = '';
    refreshMembersList();
    showToast('Team member added', 'success');
  });

  el('printQrBtn').addEventListener('click', printAllQr);

  async function createBox(n){
    if(LIVE_PARCELS.some(b => Number(b.tableNo) === n)) return false;
    await addDoc(col('tables'), { tableNo: n, kind:'parcel', status:'available', currentSession:null, qrToken:null });
    return true;
  }
  el('addBoxBtn').addEventListener('click', async () => {
    const n = Number(el('boxNo').value || 0);
    if(!n){ showToast('Enter a box number', 'error'); return; }

    showToast(made ? `${made} parcel slot${made === 1 ? '' : 's'} added` : 'Parcels 1–6 already exist', made ? 'success' : 'info');

  el('seedDemoBtn').addEventListener('click', seedDemoData);
  el('clearDemoBtn').addEventListener('click', clearDemoData);

async function refreshMenuAdminList(){
  const node = el('menuAdminList');
  node.innerHTML = MENU_ITEMS.map(i => `
    <div class="flex items-center justify-between gap-2 bg-parchment/60 rounded-xl px-3 py-2 text-sm">
      <span class="truncate flex items-center gap-1.5 ${i.available === false ? 'line-through text-ink/40' : ''}">${foodMark(i.foodType)}<span class="truncate">${esc(i.emoji || '')} ${esc(i.name)}</span></span>
      <div class="flex items-center gap-2 shrink-0">
        <button class="cycle-food text-[10px] font-bold px-2 py-1 rounded-full bg-ink/5" data-id="${escAttr(i.id)}" data-type="${escAttr(i.foodType || '')}" title="Change veg or non-veg">${esc(FOOD_TYPES[i.foodType]?.label || 'Set type')}</button>
        <span class="font-mono-num text-xs">${money(i.price)}</span>
        <button class="toggle-86 scale-tap text-[10px] font-bold px-2 py-1 rounded-full ${i.available === false ? 'bg-chili text-white' : 'bg-basil/10 text-basil'}" data-id="${escAttr(i.id)}" data-on="${i.available !== false}">${i.available === false ? 'Off menu' : 'On menu'}</button>
        <button class="del-item text-chili text-xs" data-id="${escAttr(i.id)}" data-name="${escAttr(i.name)}" aria-label="Delete"><i class="fa-solid fa-trash"></i></button>
      </div>
    </div>`).join('') || `<p class="text-ink/40 text-sm">No dishes yet.</p>`;

  node.querySelectorAll('.cycle-food').forEach(b => b.addEventListener('click', async () => {
    const order = ['veg', 'nonveg', 'egg', ''];
    const next = order[(order.indexOf(b.dataset.type || '') + 1) % order.length];
    await updateDoc(docIn('menuItems', b.dataset.id), { foodType: next || null });
    await fetchMenu(); refreshMenuAdminList();
  }));

  node.querySelectorAll('.toggle-86').forEach(b => b.addEventListener('click', async () => {
    const on = b.dataset.on === 'true';
    await updateDoc(docIn('menuItems', b.dataset.id), { available: !on });
    await fetchMenu(); refreshMenuAdminList();
    showToast(on ? 'Taken off the menu' : 'Back on the menu', on ? 'warning' : 'success');
  }));
  node.querySelectorAll('.del-item').forEach(b => b.addEventListener('click', async () => {
    if(!confirm(`Delete ${b.dataset.name}? Past orders keep their record.`)) return;
    await deleteDoc(docIn('menuItems', b.dataset.id));
    await fetchMenu(); refreshMenuAdminList();
  }));
}

function tableUrl(t){ return `${location.origin}${location.pathname}?table=${t.qrToken}`; }

async function refreshTablesList(){
  const node = el('tablesList');
  if(!node) return;
  node.innerHTML = LIVE_TABLES.map(t => `
    <div class="bg-parchment/60 rounded-2xl p-3">
      <div class="flex items-center justify-between mb-2">
        <span class="font-display font-bold">Table ${esc(String(t.tableNo))}</span>
        <button class="del-table text-chili text-xs" data-id="${escAttr(t.id)}" data-no="${escAttr(String(t.tableNo))}" aria-label="Delete"><i class="fa-solid fa-trash"></i></button>
      </div>
      <div class="qr-slot bg-surface rounded-xl p-2 flex justify-center mb-2" data-url="${escAttr(tableUrl(t))}"></div>
      <button class="copy-link w-full text-[11px] font-bold text-saffrond" data-url="${escAttr(tableUrl(t))}">Copy link</button>
    </div>`).join('') || `<p class="text-ink/40 text-sm">No tables yet.</p>`;

  node.querySelectorAll('.qr-slot').forEach(slot => {
    try{ new QRCode(slot, { text: slot.dataset.url, width:120, height:120, colorDark:'#211B14', colorLight:'#ffffff' }); }
    catch(e){ slot.textContent = 'QR unavailable'; }
  });
  node.querySelectorAll('.copy-link').forEach(b => b.addEventListener('click', async () => {
    try{ await navigator.clipboard.writeText(b.dataset.url); b.textContent = 'Copied'; }
    catch(e){ b.textContent = 'Copy failed'; }
    setTimeout(() => b.textContent = 'Copy link', 1500);
  }));
  node.querySelectorAll('.del-table').forEach(b => b.addEventListener('click', async () => {
    if(!confirm(`Delete table ${b.dataset.no}? Its QR code stops working.`)) return;
    await deleteDoc(docIn('tables', b.dataset.id));
    setTimeout(refreshTablesList, 400);
  }));
}

function printAllQr(){
  const w = window.open('', '_blank');
  if(!w){ showToast('Allow pop-ups to print QR codes', 'error'); return; }
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Table QR codes</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>
  <style>body{font-family:sans-serif;padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .c{border:1px dashed #999;border-radius:12px;padding:12px;text-align:center;page-break-inside:avoid}
  h2{margin:0 0 8px;font-size:16px}.q{display:flex;justify-content:center}</style></head><body>
  ${LIVE_TABLES.map(t => `<div class="c"><h2>Table ${escAttr(String(t.tableNo))}</h2><div class="q" data-u="${escAttr(tableUrl(t))}"></div><p style="font-size:10px;color:#666">Scan to see the menu</p></div>`).join('')}
  <scr` + `ipt>window.onload=function(){document.querySelectorAll('.q').forEach(function(d){new QRCode(d,{text:d.dataset.u,width:150,height:150});});setTimeout(function(){window.print();},600);}<\/scr` + `ipt>
  </body></html>`);
  w.document.close();
}

    node.innerHTML = snap.docs.map(d => `
      <div class="flex items-center justify-between bg-parchment/60 rounded-xl px-3 py-2 text-sm">
        <div class="min-w-0">
          <div class="font-medium truncate">${esc(d.data().email || d.id)}</div>
          <div class="text-[10px] text-ink/40 font-mono-num truncate">${esc(d.id)}</div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <span class="text-[10px] font-bold bg-ink/10 px-2 py-1 rounded-full">${esc(d.data().role)}</span>
          ${d.id === CURRENT_USER?.uid ? '' : `<button class="del-member text-chili text-xs" data-id="${escAttr(d.id)}" aria-label="Remove"><i class="fa-solid fa-trash"></i></button>`}
        </div>
      </div>`).join('') || `<p class="text-ink/40 text-sm">No team members yet.</p>`;
    node.querySelectorAll('.del-member').forEach(b => b.addEventListener('click', async () => {
      if(!confirm('Remove this person\'s access?')) return;
      await deleteDoc(docIn('members', b.dataset.id));
      refreshMembersList();
    }));
  } catch(e){ node.innerHTML = `<p class="text-ink/40 text-sm">Only admins can view the team list.</p>`; }
}

let adminFeedbackUnsub = null;
// This was a one-off read, so a review left while the Admin screen was open never
// appeared until a reload. It is a live subscription now.
async function refreshFeedbackList(){
  const node = el('feedbackList');
  if(!node) return;
  if(adminFeedbackUnsub){ adminFeedbackUnsub(); adminFeedbackUnsub = null; }
  adminFeedbackUnsub = onSnapshot(col('feedback'), (snap) => {
    const target = el('feedbackList');
    if(!target) return;
    drawFeedbackList(target, snap.docs.map(d => d.data()));
  }, () => {});
  UNSUBS.push(() => { if(adminFeedbackUnsub) adminFeedbackUnsub(); });
}

function drawFeedbackList(node, all){
  const list = all.sort((a,b) => toMillis(b.createdAt) - toMillis(a.createdAt)).slice(0, 40);
  node.innerHTML = list.map(f => `
    <div class="bg-parchment/60 rounded-xl px-3 py-2.5">
      <div class="flex items-center justify-between">
        <span class="text-sm font-semibold">Table ${esc(String(f.tableNo ?? '—'))}</span>
        <span class="text-saffrond text-sm">${'★'.repeat(f.stars || 0)}${'☆'.repeat(Math.max(0, 5 - (f.stars || 0)))}</span>
      </div>
      ${f.comment ? `<div class="text-xs text-ink/60 mt-1">${esc(f.comment)}</div>` : ''}
      <div class="text-[10px] text-ink/40 mt-1">${toMillis(f.createdAt) ? new Date(toMillis(f.createdAt)).toLocaleString([], { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }) : ''}</div>
    </div>`).join('') || `<p class="text-ink/40 text-sm">No feedback yet.</p>`;
}

// Shrinks and re-encodes in the browser. Used as a fallback when Firebase Storage
// has not been set up, so a logo still works without provisioning a bucket.
function shrinkToDataUrl(file, maxPx, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read that file'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('That file is not a readable image'));
      img.onload = () => {
        const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width  = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/webp', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

const STORAGE_ERRORS = {
  'storage/unauthorized':      'Storage rules are blocking the upload. Publish the Storage rules from the setup guide.',
  'storage/bucket-not-found':  'Firebase Storage has not been created for this project yet.',
  'storage/project-not-found': 'Firebase Storage has not been created for this project yet.',
  'storage/unknown':           'Firebase Storage has not been created for this project yet.',
  'storage/quota-exceeded':    'The Storage quota for this project is full.'
};

async function uploadAsset(file, folder, maxPx = 512){
  if(!file.type.startsWith('image/')){ showToast('Choose an image file', 'error'); return null; }
  if(file.size > 5 * 1024 * 1024){ showToast('Pick an image under 5 MB', 'error'); return null; }
  try{
    const ext  = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const ref  = sRef(storage, `${folder}/${RESTAURANT_ID}/${Date.now()}.${ext}`);
    await uploadBytes(ref, file);
    return await getDownloadURL(ref);
  } catch(e){
    // No bucket, or rules blocking it. Shrink the image and keep it inline instead
    // of failing outright — a 512px logo is a few KB and sits fine in Firestore.
    try{
      const inline = await shrinkToDataUrl(file, maxPx, 0.82);
      if(inline.length > 700000){
        showToast('That image is too large to store without Firebase Storage. Try a smaller one.', 'error');
        return null;
      }
      showToast(STORAGE_ERRORS[e.code] ? 'Saved without Storage — ' + STORAGE_ERRORS[e.code] : 'Saved without Storage', 'warning');
      return inline;
    } catch(inner){
      showToast('Upload failed: ' + (STORAGE_ERRORS[e.code] || e.message), 'error');
      return null;
    }
  }
}

const DEMO_ADDONS = [['Extra cheese', 60], ['Extra butter', 30], ['Extra gravy', 50], ['Jain (no onion garlic)', 0]];

async function seedDemoData(){
  const btn = el('seedDemoBtn');
  btn.disabled = true;
  btn.textContent = 'Adding…';
  try{
    const today = new Date().toISOString().slice(0, 10);

    // categories
    const catIds = {};
    for(const [i, name] of DEMO_CATS.entries()){
      const existing = MENU_CATS.find(c => c.name === name);
      if(existing){ catIds[name] = existing.id; continue; }
      const ref = await addDoc(col('categories'), { name, sortOrder: i, demo: true });
      catIds[name] = ref.id;
    }

    // dishes
    const made = [];
    for(const [name, cat, price, emoji, spicy, dailyLimit, foodType] of DEMO_DISHES){
      if(MENU_ITEMS.some(m => m.name === name)) continue;
      const ref = await addDoc(col('menuItems'), {
        name, price, emoji, spicy, dailyLimit, foodType,
        categoryId: catIds[cat] || null,
        soldToday: 0, soldDate: today,
        available: true, imageUrl: null, demo: true
      });
      made.push({ id: ref.id, name, price });
    }

    // add-ons
    for(const [name, price] of DEMO_ADDONS){
      if(ADDONS.some(a => a.name === name)) continue;
      await addDoc(col('addons'), { name, price, demo: true });
    }

    // tables 1–8, skipping any number you already use
    const demoTables = [];
    for(let n = 1; n <= 8; n++){
      const existing = LIVE_TABLES.find(t => Number(t.tableNo) === n);
      if(existing){ demoTables.push(existing); continue; }
      const ref = await addDoc(col('tables'), {
        tableNo: n, status: 'available', currentSession: null,
        qrToken: uid() + uid(), demo: true
      });
      demoTables.push({ id: ref.id, tableNo: n });
    }

    // Two weeks of paid orders so Analytics has a shape to show. Timestamps are
    // spread across lunch and dinner rather than dumped on the current minute.
    const pool = made.length ? made : MENU_ITEMS.slice(0, 8).map(m => ({ id:m.id, name:m.name, price:m.price }));
    if(pool.length){
      const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
      for(let d = 0; d < 14; d++){
        for(let o = 0; o < 2 + Math.floor(Math.random() * 3); o++){
          const when = new Date();
          when.setDate(when.getDate() - d);
          when.setHours(Math.random() < 0.45 ? 12 + Math.floor(Math.random() * 3) : 19 + Math.floor(Math.random() * 3),
                        Math.floor(Math.random() * 60), 0, 0);
          const lines = Array.from({ length: 2 + Math.floor(Math.random() * 3) }, () => {
            const dish = pick(pool);
            return { id: uid(), menuItemId: dish.id, name: dish.name, price: dish.price,
              qty: 1 + Math.floor(Math.random() * 2), status: 'served', round: 1,
              spiceLevel: null, addons: [], notes: null };
          });
          const table = pick(demoTables);
          await addDoc(col('orders'), {
            tableId: table.id, tableNo: table.tableNo, sessionId: 'demo-' + uid(),
            items: lines, status: 'paid', open: false,
            paymentStatus: 'paid', paymentMethod: Math.random() < 0.55 ? 'upi' : 'cash',
            billRequested: true, billRequestedAt: when, paidAt: when,
            total: lines.reduce((s, i) => s + i.price * i.qty, 0),
            placedBy: { mode: Math.random() < 0.25 ? 'staff' : 'customer', by: null },
            createdAt: when, updatedAt: when, demo: true
          });
        }
      }
    }

    // a few reviews
    const comments = ['Biryani was excellent.', 'Service was quick, food was hot.', null,
                      'Naan came late but tasted great.', null, 'Will come back with family.'];
    for(let i = 0; i < comments.length; i++){
      const when = new Date();
      when.setDate(when.getDate() - i * 2);
      await addDoc(col('feedback'), {
        orderId: 'demo', tableNo: 1 + (i % 8),
        stars: [5,4,5,3,5,4][i], comment: comments[i],
        createdAt: when, demo: true
      });
    }

    await fetchMenu();
    REPORTS_LOADED = false;
    showToast('Demo data added', 'success');
    loadAdmin();
  } catch(e){
    showToast('Could not add demo data: ' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Add demo data';
  }
}

async function clearDemoData(){
  if(!confirm('Remove all demo content?\n\nAnything you created yourself is left alone — only items added by "Add demo data" are deleted.')) return;
  const btn = el('clearDemoBtn');
  btn.disabled = true;
  btn.textContent = 'Removing…';
  try{
    let removed = 0;
    for(const name of ['orders','feedback','menuItems','addons','categories','tables','calls']){
      const snap = await getDocs(query(col(name), where('demo', '==', true)));
      // Firestore caps a batch at 500 writes, so large demo sets go in chunks.
      for(let i = 0; i < snap.docs.length; i += 400){
        const batch = writeBatch(db);
        snap.docs.slice(i, i + 400).forEach(d => batch.delete(d.ref));
        await batch.commit();
      }
      removed += snap.docs.length;
    }
    await fetchMenu();
    REPORTS_LOADED = false;
    showToast(removed ? `Removed ${removed} demo records` : 'No demo data found', removed ? 'success' : 'info');
    loadAdmin();
  } catch(e){
    showToast('Could not clear: ' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Remove demo data';
  }
}
