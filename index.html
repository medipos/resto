<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#211B14">
<title>Hotel Sandeep</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
  tailwind.config = {
    theme: { extend: {
      colors: {
        ink:      'rgb(var(--c-ink) / <alpha-value>)',
        cream:    'rgb(var(--c-cream) / <alpha-value>)',
        parchment:'rgb(var(--c-parchment) / <alpha-value>)',
        surface:  'rgb(var(--c-surface) / <alpha-value>)',
        saffron:  'rgb(var(--c-saffron) / <alpha-value>)',
        saffrond: 'rgb(var(--c-saffrond) / <alpha-value>)',
        chili:    'rgb(var(--c-chili) / <alpha-value>)',
        basil:    'rgb(var(--c-basil) / <alpha-value>)',
        basild:   'rgb(var(--c-basild) / <alpha-value>)',
        info:     'rgb(var(--c-info) / <alpha-value>)',
        violet:   'rgb(var(--c-violet) / <alpha-value>)'
      },
      fontFamily: {
        display:['Fraunces','serif'], body:['Inter','sans-serif'], mono:['JetBrains Mono','monospace']
      }
    }}
  }
</script>

<style>
  *{ -webkit-tap-highlight-color:transparent; }
  html,body{ font-family:'Inter',sans-serif; }
  /* ---------- themes ---------- */
  :root, [data-theme="classic"]{
    --c-ink:33 27 20; --c-cream:251 246 236; --c-parchment:243 236 220; --c-surface:255 255 255;
    --c-saffron:224 145 47; --c-saffrond:199 122 34; --c-chili:193 68 46;
    --c-basil:76 122 94; --c-basild:58 95 73; --c-info:37 99 160; --c-violet:109 60 168;
    --app-bg:#FBF6EC; --card-blur:none; --card-alpha:1; --card-border:rgba(33,27,20,.10);
  }
  [data-theme="midnight"]{
    --c-ink:232 226 214; --c-cream:23 22 28; --c-parchment:42 40 50; --c-surface:33 32 40;
    --c-saffron:236 168 74; --c-saffrond:214 140 48; --c-chili:224 100 80;
    --c-basil:110 176 134; --c-basild:86 148 110; --c-info:96 165 220; --c-violet:181 152 255;
    --app-bg:#17161C; --card-blur:none; --card-alpha:1; --card-border:rgba(255,255,255,.10);
  }
  [data-theme="emerald"]{
    --c-ink:19 41 33; --c-cream:244 250 245; --c-parchment:225 240 229; --c-surface:255 255 255;
    --c-saffron:200 148 46; --c-saffrond:170 122 32; --c-chili:190 70 60;
    --c-basil:36 122 84; --c-basild:26 94 64; --c-info:32 110 150; --c-violet:104 66 176;
    --app-bg:#F4FAF5; --card-blur:none; --card-alpha:1; --card-border:rgba(19,41,33,.10);
  }
  [data-theme="royal"]{
    --c-ink:38 26 56; --c-cream:250 247 253; --c-parchment:236 229 246; --c-surface:255 255 255;
    --c-saffron:198 158 62; --c-saffrond:168 130 42; --c-chili:186 62 96;
    --c-basil:92 86 176; --c-basild:70 64 148; --c-info:70 110 190; --c-violet:138 96 214;
    --app-bg:#FAF7FD; --card-blur:none; --card-alpha:1; --card-border:rgba(38,26,56,.10);
  }
  [data-theme="glass"]{
    --c-ink:28 26 46; --c-cream:255 255 255; --c-parchment:255 255 255; --c-surface:255 255 255;
    --c-saffron:235 150 60; --c-saffrond:206 120 36; --c-chili:214 74 96;
    --c-basil:60 150 132; --c-basild:44 120 106; --c-info:52 120 190; --c-violet:120 80 190;
    --app-bg:transparent; --card-blur:blur(16px) saturate(1.5); --card-alpha:.55; --card-border:rgba(255,255,255,.55);
  }

  html{ background:var(--app-bg); }
  body{ background:var(--app-bg); color:rgb(var(--c-ink)); }

  /* Glassmorphism needs translucency and blur, not just different colours, so it
     restyles the card and header surfaces rather than only swapping variables. */
  [data-theme="glass"] body{
    background:
      radial-gradient(1100px 700px at 12% -8%, #ffd9a8 0%, transparent 55%),
      radial-gradient(900px 640px at 92% 8%, #b8d8ff 0%, transparent 52%),
      radial-gradient(900px 700px at 45% 105%, #ffc7d8 0%, transparent 50%),
      linear-gradient(160deg, #f4f7ff 0%, #fdf2f6 100%);
    background-attachment: fixed;
  }
  [data-theme="glass"] .bg-surface{
    background:rgba(255,255,255,var(--card-alpha)) !important;
    -webkit-backdrop-filter:var(--card-blur); backdrop-filter:var(--card-blur);
    border-color:var(--card-border) !important;
    box-shadow:0 8px 32px rgba(31,38,135,.10);
  }
  [data-theme="glass"] .bg-ink{
    background:rgba(28,26,46,.72) !important;
    -webkit-backdrop-filter:blur(18px) saturate(1.4); backdrop-filter:blur(18px) saturate(1.4);
  }
  [data-theme="glass"] .bg-parchment,
  [data-theme="glass"] .bg-parchment\/60,
  [data-theme="glass"] .bg-parchment\/70{
    background:rgba(255,255,255,.42) !important;
  }
  [data-theme="glass"] header{ border-bottom:1px solid rgba(255,255,255,.25); }

  /* Midnight swaps ink and cream, which would otherwise flip the header into a
     bright bar. These keep dark surfaces dark and light text light. */
  [data-theme="midnight"] .bg-ink{ background:#0E0D12 !important; }
  [data-theme="midnight"] .text-cream{ color:#E8E2D6 !important; }
  [data-theme="midnight"] .bg-cream{ background:#212028 !important; }
  [data-theme="midnight"] .bg-surface{ box-shadow:0 1px 3px rgba(0,0,0,.4); }
  [data-theme="midnight"] input,
  [data-theme="midnight"] textarea,
  [data-theme="midnight"] select{ background:rgb(var(--c-parchment)); color:rgb(var(--c-ink)); }
  [data-theme="midnight"] input::placeholder,
  [data-theme="midnight"] textarea::placeholder{ color:rgb(var(--c-ink) / .4); }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:rgba(33,27,20,.25); border-radius:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  .font-display{ font-family:'Fraunces',serif; }
  .font-mono-num{ font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; }
  .hidden-view{ display:none !important; }
  .scale-tap:active{ transform:scale(.97); }
  .fade-in{ animation:fadeIn .25s ease both; }
  @keyframes fadeIn{ from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
  .pulse-badge{ animation:pulseBadge .9s ease-in-out infinite; }
  @keyframes pulseBadge{ 0%,100%{box-shadow:0 0 0 0 rgba(122,18,10,.9); opacity:1;} 55%{box-shadow:0 0 0 7px rgba(122,18,10,0); opacity:.55;} }

  .toast-in{ animation:toastIn .25s cubic-bezier(.2,.9,.3,1.2) both; }
  @keyframes toastIn{ from{opacity:0;transform:translateY(14px) scale(.94);} to{opacity:1;transform:none;} }

  /* Tables glow warm, parcel boxes glow cool, so a glance tells them apart even
     before you read the label. */
  /* Deep, quick pulses. These fire only on states that need someone to walk over,
     so they are meant to catch the eye from across the room. */
  .glow-red,.glow-amber,.glow-blue,.glow-violet,.glow-green{ animation-duration:.85s; animation-timing-function:ease-in-out; animation-iteration-count:infinite; }
  .glow-red   { animation-name:glowRed; }
  .glow-amber { animation-name:glowAmber; }
  .glow-blue  { animation-name:glowBlue; }
  .glow-violet{ animation-name:glowViolet; }
  .glow-green { animation-name:glowGreen; }
  @keyframes glowRed{
    0%,100%{ box-shadow:inset 0 0 0 2px rgba(138,24,14,.40); background-color:rgba(176,44,28,.10); }
    50%    { box-shadow:inset 0 0 0 4px rgba(122,18,10,1);   background-color:rgba(176,44,28,.42); }
  }
  @keyframes glowAmber{
    0%,100%{ box-shadow:inset 0 0 0 2px rgba(150,88,10,.40); background-color:rgba(206,132,26,.12); }
    50%    { box-shadow:inset 0 0 0 4px rgba(140,80,6,1);    background-color:rgba(206,132,26,.46); }
  }
  @keyframes glowBlue{
    0%,100%{ box-shadow:inset 0 0 0 2px rgba(12,54,118,.40); background-color:rgba(20,78,158,.10); }
    50%    { box-shadow:inset 0 0 0 4px rgba(8,40,96,1);     background-color:rgba(20,78,158,.42); }
  }
  @keyframes glowGreen{
    0%,100%{ box-shadow:inset 0 0 0 2px rgba(30,86,58,.40); background-color:rgba(58,124,88,.10); }
    50%    { box-shadow:inset 0 0 0 4px rgba(22,72,46,1);   background-color:rgba(58,124,88,.38); }
  }
  @keyframes glowViolet{
    0%,100%{ box-shadow:inset 0 0 0 2px rgba(72,34,120,.40); background-color:rgba(109,60,168,.12); }
    50%    { box-shadow:inset 0 0 0 4px rgba(60,26,105,1);   background-color:rgba(109,60,168,.44); }
  }
  .glow-soft{ animation:glowSoft 2.4s ease-in-out infinite; }
  @keyframes glowSoft{ 0%,100%{opacity:1;} 50%{opacity:.72;} }

  .tile{ position:relative; overflow:hidden; transition:transform .12s ease, box-shadow .18s ease; }
  .tile:active{ transform:scale(.96); }
  .tile-strip{ position:absolute; inset:0 0 auto 0; height:4px; }
  /* Square, with everything stacked and centred, so tables and parcels read as
     one consistent grid instead of mismatched rectangles. */
  .tile-sq{ aspect-ratio:1 / 1; display:flex; flex-direction:column;
            align-items:center; justify-content:center; text-align:center;
            padding:6px; gap:1px; }
  .tile-sq .tile-no{ line-height:1; }
  .glow-red .tile-no,.glow-amber .tile-no,.glow-blue .tile-no,.glow-violet .tile-no,.glow-green .tile-no{ position:relative; }
  .badge{ display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:700;
          padding:2px 8px; border-radius:999px; line-height:1.5; white-space:nowrap; }

  /* Status board: one column per state, scrolled sideways on a phone. Columns keep
     their position even when empty so staff learn where to look. */
  .board{ display:flex; gap:0; overflow-x:auto; scroll-snap-type:x proximity; padding-bottom:4px; }
  .board-col{ flex:1 0 172px; min-width:172px; padding:0 9px; scroll-snap-align:start;
              border-right:1px solid rgb(var(--c-ink) / .12); }
  /* Tiles get a fixed size rather than dividing the column, so one lone table in a
     column is exactly the same size as one of six. Two fit on a phone, three on a
     wider screen. */
  .board-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(70px, 1fr));
               gap:6px; justify-items:stretch; }
  @media (min-width:1280px){ .board-col{ flex:1 1 0; min-width:0; } }
  .board-col:first-child{ padding-left:0; }
  .board-col:last-child{ border-right:none; padding-right:0; }
  @media (min-width:1024px){ .board-col{ flex:1 1 0; min-width:0; } }
  .board-head{ position:sticky; top:0; padding:6px 0 10px; }
  .board-empty{ border:1px dashed rgb(var(--c-ink) / .15); border-radius:14px;
                padding:14px 6px; text-align:center; font-size:10px; }
  input:focus,textarea:focus,select:focus{ outline:none; }
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:2px solid #E0912F; outline-offset:2px;
  }
  .no-scrollbar::-webkit-scrollbar{ display:none; }
  .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }
  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body class="text-ink font-body antialiased">

<div id="offlineBanner" class="hidden-view fixed top-0 inset-x-0 z-[90] bg-chili text-white text-center text-xs font-bold py-1.5">
  You're offline — changes will not save until you reconnect
</div>

<div id="toastRoot" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-[100] flex flex-col items-center gap-2 pointer-events-none px-4 w-full max-w-sm"></div>

<!-- ===================== LOADING ===================== -->
<div id="loadingView" class="min-h-screen flex flex-col items-center justify-center gap-4">
  <div class="w-14 h-14 rounded-2xl bg-ink flex items-center justify-center">
    <span class="font-display font-black text-cream text-xl">HS</span>
  </div>
  <div class="text-ink/40 text-sm">Loading…</div>
</div>

<!-- ===================== CUSTOMER ===================== -->
<div id="customerView" class="hidden-view min-h-screen pb-40">
  <header class="sticky top-0 z-30 bg-ink text-cream">
    <div class="max-w-2xl mx-auto px-4 h-16 sm:h-20 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="brand-logo-slot shrink-0"></div>
        <div class="min-w-0">
          <div id="custBrandName" class="font-display font-bold text-base leading-tight truncate">HOTEL SANDEEP</div>
          <div id="custTableLabel" class="text-[11px] text-cream/60 leading-tight">Table</div>
        </div>
      </div>
      <button id="cartBtn" class="scale-tap relative w-11 h-11 rounded-full bg-white/10 flex items-center justify-center shrink-0" aria-label="Open cart">
        <i class="fa-solid fa-basket-shopping"></i>
        <span id="cartCount" class="hidden absolute -top-0.5 -right-0.5 min-w-[20px] h-5 px-1 rounded-full bg-chili text-[11px] font-bold flex items-center justify-center">0</span>
      </button>
    </div>
  </header>

  <div id="custActionBar" class="max-w-2xl mx-auto px-4 pt-3">
    <div class="grid grid-cols-3 gap-2">
      <button id="btnCallWater" class="scale-tap bg-surface border border-ink/10 rounded-2xl py-2.5 text-xs font-semibold flex flex-col items-center gap-1">
        <i class="fa-solid fa-glass-water text-saffron"></i>Water</button>
      <button id="btnCallCutlery" class="scale-tap bg-surface border border-ink/10 rounded-2xl py-2.5 text-xs font-semibold flex flex-col items-center gap-1">
        <i class="fa-solid fa-utensils text-saffron"></i>Cutlery</button>
      <button id="btnCallWaiter" class="scale-tap bg-surface border border-ink/10 rounded-2xl py-2.5 text-xs font-semibold flex flex-col items-center gap-1">
        <i class="fa-solid fa-bell-concierge text-saffron"></i>Waiter</button>
    </div>
    <div id="waterChoice" class="hidden-view grid grid-cols-3 gap-2 mt-2">
      <button class="water-opt scale-tap bg-parchment rounded-xl py-2.5 text-xs font-semibold" data-water="water_normal">Normal</button>
      <button class="water-opt scale-tap bg-parchment rounded-xl py-2.5 text-xs font-semibold" data-water="water_cold">Chilled</button>
      <button id="btnWaterBottled" class="water-opt scale-tap bg-parchment rounded-xl py-2.5 text-xs font-semibold leading-tight" data-water="water_bottled">Bottled</button>
    </div>
    <div id="myRequests" class="hidden-view bg-surface border border-ink/10 rounded-2xl px-3 py-2.5 mt-2 space-y-1.5"></div>
    <div id="geoBanner" class="hidden-view mt-2"></div>
    <div id="custMsg" class="mt-2"></div>
  </div>

  <div id="custOrders" class="hidden-view max-w-2xl mx-auto px-4 pt-3"></div>

  <div class="max-w-2xl mx-auto px-4 pt-3 space-y-2">
    <input id="custSearch" type="search" placeholder="Search the menu…" class="w-full px-4 py-2.5 rounded-2xl border border-ink/10 bg-surface text-sm">
    <div class="flex gap-2">
      <select id="custCategory" class="flex-1 px-3 py-2.5 rounded-2xl border border-ink/10 bg-surface text-sm font-semibold">
        <option value="">All courses</option>
      </select>
      <div class="flex gap-1 bg-ink/5 rounded-2xl p-1">
        <button class="diet-opt scale-tap px-3 py-1.5 rounded-xl text-xs font-bold" data-diet="">All</button>
        <button class="diet-opt scale-tap px-2.5 py-1.5 rounded-xl text-xs font-bold" data-diet="veg" title="Vegetarian only"><span class="inline-flex items-center justify-center w-3.5 h-3.5 rounded-[3px] border-[1.5px]" style="border-color:#4C7A5E"><span class="w-1.5 h-1.5 rounded-full" style="background:#4C7A5E"></span></span></button>
        <button class="diet-opt scale-tap px-2.5 py-1.5 rounded-xl text-xs font-bold" data-diet="nonveg" title="Non-vegetarian only"><span class="inline-flex items-center justify-center w-3.5 h-3.5 rounded-[3px] border-[1.5px]" style="border-color:#C1442E"><span class="w-1.5 h-1.5 rounded-full" style="background:#C1442E"></span></span></button>
      </div>
    </div>
  </div>

  <main id="menuRoot" class="max-w-2xl mx-auto px-4 pt-4"></main>

  <div id="orderStatusBar" class="hidden-view fixed bottom-0 inset-x-0 z-30 bg-ink text-cream px-4 py-3"></div>
</div>

<!-- ===================== ITEM MODAL ===================== -->
<div id="itemModal" class="hidden-view fixed inset-0 z-[80]">
  <div id="itemModalOverlay" class="absolute inset-0 bg-black/50"></div>
  <div class="absolute bottom-0 inset-x-0 bg-cream rounded-t-3xl p-5 max-h-[88vh] overflow-y-auto">
    <div id="itemModalBody"></div>
  </div>
</div>

<!-- ===================== COUNTER ACTION SHEET ===================== -->
<div id="actionSheet" class="hidden-view fixed inset-0 z-[88]">
  <div id="actionSheetOverlay" class="absolute inset-0 bg-black/50"></div>
  <div class="absolute bottom-0 inset-x-0 bg-cream rounded-t-3xl p-5 max-h-[88vh] overflow-y-auto">
    <div id="actionSheetBody"></div>
  </div>
</div>

<!-- ===================== CUSTOMER BILL ===================== -->
<div id="billSheet" class="hidden-view fixed inset-0 z-[85]">
  <div id="billSheetOverlay" class="absolute inset-0 bg-black/60"></div>
  <div class="absolute inset-x-0 bottom-0 bg-cream rounded-t-3xl max-h-[92vh] flex flex-col">
    <div class="flex items-center justify-between p-5 pb-2">
      <div class="font-display font-bold text-xl">Your bill</div>
      <button id="billSheetClose" class="w-8 h-8 rounded-full bg-ink/5 flex items-center justify-center" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="billSheetBody" class="px-5 overflow-y-auto flex-1"></div>
    <div class="p-5 pt-3 border-t border-ink/10">
      <button id="billSheetPrint" class="scale-tap w-full bg-ink text-cream font-bold py-3 rounded-2xl text-sm">Save or print a copy</button>
    </div>
  </div>
</div>

<!-- ===================== CART DRAWER ===================== -->
<div id="cartDrawer" class="hidden-view fixed inset-0 z-[75]">
  <div id="cartOverlay" class="absolute inset-0 bg-black/50"></div>
  <div class="absolute bottom-0 inset-x-0 bg-cream rounded-t-3xl max-h-[85vh] flex flex-col">
    <div class="flex items-center justify-between p-5 pb-3">
      <div class="font-display font-bold text-xl">Your order</div>
      <button id="closeCart" class="w-8 h-8 rounded-full bg-ink/5 flex items-center justify-center" aria-label="Close cart"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="cartItems" class="px-5 space-y-3 overflow-y-auto flex-1"></div>
    <div class="p-5 pt-3 border-t border-ink/10">
      <div class="flex justify-between items-center mb-3">
        <span class="text-sm font-semibold text-ink/60">Total</span>
        <span id="cartTotal" class="font-mono-num font-bold text-xl">₹0</span>
      </div>
      <button id="placeOrderBtn" class="scale-tap w-full bg-chili text-cream font-bold py-3.5 rounded-2xl">Send order to kitchen</button>
      <button id="placeOrderCourseBtn" class="hidden-view scale-tap w-full mt-2 bg-surface border border-ink/15 font-bold py-3 rounded-2xl text-sm">Send course by course</button>
      <div id="courseNote" class="hidden-view text-[11px] text-ink/40 mt-2 text-center"></div>
    </div>
  </div>
</div>

<!-- ===================== LOGIN ===================== -->
<div id="loginView" class="hidden-view min-h-screen flex items-center justify-center px-5">
  <div class="w-full max-w-sm">
    <div class="flex flex-col items-center mb-7">
      <div class="brand-logo-slot mb-3"></div>
      <div id="loginBrandName" class="font-display font-bold text-2xl tracking-tight">HOTEL SANDEEP</div>
      <div class="text-ink/40 text-sm mt-1">Staff sign in</div>
    </div>
    <div class="bg-surface rounded-3xl border border-ink/10 p-6">
      <div id="loginMsg"></div>
      <label class="text-xs font-semibold text-ink/60" for="loginEmail">Email</label>
      <input id="loginEmail" type="email" autocomplete="username" class="w-full mt-1 mb-3 px-3.5 py-2.5 rounded-xl border border-ink/15" placeholder="you@hotelsandeep.in">
      <label class="text-xs font-semibold text-ink/60" for="loginPassword">Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password" class="w-full mt-1 mb-4 px-3.5 py-2.5 rounded-xl border border-ink/15" placeholder="••••••••">
      <button id="loginBtn" class="scale-tap w-full bg-ink text-cream font-bold py-3 rounded-xl">Sign in</button>
      <button id="forgotBtn" class="w-full text-xs text-ink/40 font-semibold mt-3">Forgot password?</button>
    </div>
    <div class="text-center text-[11px] text-ink/30 mt-5">Customers: scan the QR code on your table.</div>
  </div>
</div>

<!-- ===================== STAFF ===================== -->
<div id="staffView" class="hidden-view min-h-screen flex flex-col">
  <header class="sticky top-0 z-40 bg-ink text-cream">
    <div class="max-w-7xl mx-auto px-3 sm:px-5">
      <div class="h-16 sm:h-20 flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5 min-w-0 shrink-0">

function applyTheme(id){
  const theme = THEMES.some(t => t.id === id) ? id : 'classic';

// Escapes text nodes. Does NOT make a string safe inside an attribute.
function esc(s){ const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
// Attribute-safe: also neutralises the quote characters that let a value
// break out of an attribute and inject an event handler.
function escAttr(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function toMillis(ts){

}

/* ---------- sound ---------- */
let AUDIO_CTX = null;
function unlockAudio(){
  try{
    AUDIO_CTX = AUDIO_CTX || new (window.AudioContext || window.webkitAudioContext)();
    if(AUDIO_CTX.state === 'suspended') AUDIO_CTX.resume();
  } catch(e){}
}
function playChime(kind){
  if(!SOUND_ON) return;
  try{
    unlockAudio();
    if(!AUDIO_CTX) return;
    const freqs = kind === 'call' ? [880, 660] : [520, 780];
    freqs.forEach((f, i) => {
      const osc = AUDIO_CTX.createOscillator(), gain = AUDIO_CTX.createGain();
      osc.frequency.value = f; osc.type = 'sine';
      const t = AUDIO_CTX.currentTime + i * 0.16;
      gain.gain.setValueAtTime(0.15, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.connect(gain).connect(AUDIO_CTX.destination);
      osc.start(t); osc.stop(t + 0.3);
    });
  } catch(e){}
}

/* ---------- branding ---------- */
function applyBranding(name){

function applyLogo(url){

  const fallback = `<div class="w-10 h-10 sm:w-14 sm:h-14 rounded-xl bg-saffron/20 border border-saffron flex items-center justify-center"><span class="font-display font-black text-saffron text-xs sm:text-base">HS</span></div>`;
  document.querySelectorAll('.brand-logo-slot').forEach(slot => {
    if(!url){ slot.innerHTML = fallback; return; }
    // The fallback markup contains double quotes, so it cannot live inside an
    // onerror="" attribute — it closed the attribute early and leaked its own
    // text into the header. The handler is bound in JS instead.
    slot.innerHTML = `<div class="w-10 h-10 sm:w-14 sm:h-14 rounded-xl bg-cream p-0.5 flex items-center justify-center overflow-hidden"><img alt="" class="max-w-full max-h-full rounded-lg object-contain"></div>`;
    const img = slot.querySelector('img');
    img.addEventListener('error', () => { slot.innerHTML = fallback; });
    img.src = url;
  });
}
applyLogo(null);

/* ---------- PWA manifest, generated in-page so this stays one file ---------- */
(function injectManifest(){
  const iconSvg = (size) => `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 512 512">
<rect width="512" height="512" fill="#211B14"/>

/* ---------- view switching ---------- */
function showOnly(id){

/* =========================================================
   4. BOOT
   ========================================================= */
const NAV_ALLOWED = {
  // kitchen sees only the pass. manager runs the floor. counter, management and
  // admin see everything.
  kitchen:   ['admin','management','counter','manager','kitchen'],
  pos:       ['admin','management','counter','manager'],
  tables:    ['admin','management','counter','manager'],
  manager:   ['admin','management','counter','manager'],
  parcels:   ['admin','management','counter'],
  counter:   ['admin','management','counter'],
  reports:   ['admin','management','counter'],
  analytics: ['admin','management','counter'],
  admin:     ['admin','management','counter'],
};

async function boot(){
  const tableToken = new URLSearchParams(location.search).get('table');
  IS_CUSTOMER = !!tableToken;

  try{
    const snap = await getDoc(restRef());
    if(snap.exists()){
      REST_INFO = { ...REST_INFO, ...snap.data() };
      applyBranding(snap.data().name);
      applyLogo(snap.data().logoUrl || null);
    }
  } catch(e){ /* rules may block this until sign-in; retried below */ }

  if(IS_CUSTOMER){
    // Customers get an anonymous identity so security rules can require auth
    // instead of leaving the database open to the world.
    try{
      // Firebase restores a saved session asynchronously, so auth.currentUser is
      // still null the instant this runs. Checking it directly minted a brand new
      // anonymous account on every single page load.
      if(auth.authStateReady) await auth.authStateReady();
      else await new Promise(r => { const u = onAuthStateChanged(auth, () => { u(); r(); }); });
      if(!auth.currentUser) await signInAnonymously(auth);
    } catch(e){
      // This used to blame the network, which sent people looking in the wrong
      // place. The cause is nearly always a sign-in provider that is switched off.
      const reasons = {
        'auth/operation-not-allowed':     'Anonymous sign-in is turned off for this restaurant.',
        'auth/admin-restricted-operation':'Anonymous sign-in is turned off for this restaurant.',
        'auth/unauthorized-domain':       'This web address is not approved for sign-in.',
        'auth/network-request-failed':    'No connection. Check your internet and reload.'
      };
      showOnly('customerView');
      el('custActionBar').classList.add('hidden-view');
      el('menuRoot').innerHTML = errorPanel(
        'Ordering is unavailable',
        (reasons[e.code] || 'Sign-in failed.') + ' Please show this to a staff member: ' + (e.code || e.message)
      );
      return;
    }
    await bootCustomer(tableToken);
  } else {
    onAuthStateChanged(auth, async (user) => {
      if(user && user.isAnonymous){
        // Left over from scanning a table QR on this device. Without this the app
        // sat on the loading screen forever, because an anonymous user is neither
        // a signed-out visitor nor a staff member.
        await signOut(auth);
        return;
      }
      if(user){
        if(STAFF_BOOTED && CURRENT_USER?.uid === user.uid) return;  // token refresh, not a new sign-in
        CURRENT_USER = user;
        bootStaff(user);
      } else {
        teardown();
        showOnly('loginView');
      }
    });
  }
}

function teardown(){
  while(UNSUBS.length){ try{ UNSUBS.pop()(); } catch(e){} }
  STAFF_BOOTED = false;
  CURRENT_ROLE = null;
  CURRENT_USER = null;
  ACTIVE_VIEW  = null;
}

function errorPanel(title, body){

}

async function bootCustomer(token){

    showOnly('customerView');
    el('custActionBar').classList.add('hidden-view');

    return;

  const tDoc = found.docs[0];
  CURRENT_TABLE   = { id: tDoc.id, ...tDoc.data() };
  CURRENT_SESSION = CURRENT_TABLE.currentSession || null;
  el('custTableLabel').textContent = 'Table ' + CURRENT_TABLE.tableNo;
  showOnly('customerView');

  const rest = await getDoc(restRef());
  if(rest.exists()){ REST_INFO = { ...REST_INFO, ...rest.data() }; applyBranding(rest.data().name); applyLogo(rest.data().logoUrl || null); }

  try{
    const s = await getDoc(settingsRef());
    if(s.exists()){
      applyTheme(s.data().theme || 'classic');
      GEOFENCE = { ...GEOFENCE, ...(s.data().geofence || {}) };
      PIN_REQUIRED = s.data().requireTablePin !== false;
      BOTTLED_WATER = {
        name:  s.data().bottledWaterName  || 'Bottled water',
        price: Number(s.data().bottledWaterPrice || 0)

  el('btnWaterBottled').innerHTML = BOTTLED_WATER.price > 0
    ? `${esc(BOTTLED_WATER.name)}<br><span class="text-[10px] text-saffrond font-mono-num">${money(BOTTLED_WATER.price)}</span>`

  if(!CURRENT_SESSION){
    el('custActionBar').classList.add('hidden-view');
    el('menuRoot').innerHTML = errorPanel('This table is not open yet', 'Check in with a staff member and they will start your table.');
    return;
  }

  if(!(await askForTablePin())) return;

  wireCallButtons();
  await loadMenuForCustomer();
  restoreCart();
  renderCartBadge();
  watchMyOrder();
  watchMyTable();
  // Deliberately not awaited: the guest reads the menu while this resolves.
  runGeoCheck();
}

/* ---------- table PIN ----------
   The code is spoken by staff at the table and dies when the table closes, so a
   photograph of the QR taken last week is not enough to place an order. */
function askForTablePin(){
  const pin = CURRENT_TABLE.sessionPin;
  // Tables seated before PINs were switched on keep working rather than stranding
  // a party mid-meal.
  if(!PIN_REQUIRED || !pin) return Promise.resolve(true);

  const key = 'hs_pin_ok_' + CURRENT_SESSION;
  try{ if(localStorage.getItem(key) === pin) return Promise.resolve(true); } catch(e){}

  el('custActionBar').classList.add('hidden-view');
  el('custOrders').classList.add('hidden-view');

  return new Promise((resolve) => {
    let tries = 0, lockedUntil = 0;

    const draw = (msg) => {
      el('menuRoot').innerHTML = `
        <div class="max-w-sm mx-auto text-center pt-10">
          <div class="w-14 h-14 rounded-2xl bg-saffron/15 flex items-center justify-center mx-auto mb-4">
            <i class="fa-solid fa-lock text-saffron text-xl"></i>
          </div>
          <h2 class="font-display font-bold text-2xl mb-1">Table ${esc(String(CURRENT_TABLE.tableNo))}</h2>
          <p class="text-sm text-ink/50 mb-6">Enter the 4-digit code your server gave you.</p>
          <input id="pinInput" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off"
                 class="w-44 mx-auto block text-center text-4xl font-mono-num tracking-[0.4em] px-4 py-3 rounded-2xl border-2 border-ink/15 bg-surface"
                 placeholder="••••">
          <div id="pinMsg" class="mt-3 min-h-[24px] text-sm font-semibold text-chili">${msg ? esc(msg) : ''}</div>
          <button id="pinGo" class="scale-tap w-44 bg-ink text-cream font-bold py-3 rounded-2xl mt-2">Start ordering</button>
          <p class="text-xs text-ink/40 mt-6">Don't have a code? Ask any staff member — they can also take your order directly.</p>
        </div>`;

      const box = el('pinInput'), go = el('pinGo');
      box.focus();
      box.addEventListener('input', () => {
        box.value = box.value.replace(/\D/g, '');
        if(box.value.length === 4) submit();
      });
      box.addEventListener('keydown', (e) => { if(e.key === 'Enter') submit(); });
      go.addEventListener('click', submit);

      function submit(){
        if(Date.now() < lockedUntil){
          el('pinMsg').textContent = `Too many tries. Wait ${Math.ceil((lockedUntil - Date.now()) / 1000)}s.`;
          return;
        }
        if(box.value === pin){
          try{ localStorage.setItem(key, pin); } catch(e){}
          el('custActionBar').classList.remove('hidden-view');
          resolve(true);
          return;
        }
        tries++;
        box.value = '';
        if(tries >= 5){
          // Slows down anyone working through all 9000 combinations by hand.
          lockedUntil = Date.now() + 30000;
          tries = 0;
          el('pinMsg').textContent = 'Too many tries. Wait 30 seconds.';
          return;
        }
        el('pinMsg').textContent = `That code is not right. ${5 - tries} ${5 - tries === 1 ? 'try' : 'tries'} left.`;
        box.focus();
      }
    };
    draw('');
  });
}

function watchMyCalls(){
  if(callsUnsub) return;   // one listener per table, however many requests are sent
  callsUnsub = onSnapshot(query(col('calls'), where('tableId', '==', CURRENT_TABLE.id)), (snap) => {
    snap.docChanges().forEach(chg => {

async function fetchMenu(){
  const [catSnap, itemSnap, addonSnap] = await Promise.all([
    getDocs(col('categories')), getDocs(col('menuItems')), getDocs(col('addons'))
  ]);
  MENU_CATS  = catSnap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => (a.sortOrder ?? 999) - (b.sortOrder ?? 999));
  MENU_ITEMS = itemSnap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => String(a.name).localeCompare(String(b.name)));
  ADDONS     = addonSnap.docs.map(d => ({ id:d.id, ...d.data() }));
  resetStaleSoldCounts();

// soldToday used to grow forever, so a dish with a daily limit stayed sold out
// the next morning. Anything counted on an earlier date is cleared on load.
async function resetStaleSoldCounts(){
  const today = new Date().toISOString().slice(0, 10);
  const stale = MENU_ITEMS.filter(i => (i.soldToday || 0) > 0 && i.soldDate !== today);
  if(stale.length === 0) return;
  try{
    const batch = writeBatch(db);
    stale.forEach(i => { batch.update(docIn('menuItems', i.id), { soldToday: 0, soldDate: today }); i.soldToday = 0; i.soldDate = today; });
    await batch.commit();
  } catch(e){ /* customers cannot write here; staff will clear it */ }
}

function isSoldOut(i){
  if(i.available === false) return true;
  if(!i.dailyLimit) return false;
  return (i.soldToday || 0) >= i.dailyLimit;
}

// Anything without a food type set stays visible on "All" but is hidden by the
// veg and non-veg filters, so an unlabelled dish is never wrongly called veg.
function matchesFilter(i, f){
  if(f.term && !String(i.name).toLowerCase().includes(f.term)) return false;
  if(f.categoryId && (i.categoryId || '') !== f.categoryId) return false;
  if(f.diet === 'veg'    && i.foodType !== 'veg') return false;
  if(f.diet === 'nonveg' && !(i.foodType === 'nonveg' || i.foodType === 'egg')) return false;
  return true;
}

function addToCart(target, item, qty, spice, addons, notes){
  const cart = target === 'pos' ? POS_CART : CART;
  const addonNames = addons.map(a => a.name);
  const unitPrice = item.price + addons.reduce((s,a) => s + a.price, 0);
  const match = cart.find(c =>
    c.menuItemId === item.id && c.spiceLevel === (spice || null) &&
    c.notes === (notes || null) && JSON.stringify(c.addons) === JSON.stringify(addonNames));
  if(match) match.qty += qty;
  else cart.push({
    menuItemId: item.id, name: item.name, price: unitPrice, qty,
    spiceLevel: spice || null, addons: addonNames, notes: notes || null,
    categoryId: item.categoryId || null, foodType: item.foodType || null
  });
  if(target === 'pos'){
    renderPosCart();
    // The bottom bar with the item count and the Review button belongs to the menu
    // screen, not the cart sheet. Without this redraw it kept the values from the
    // last draw, so the button stayed at zero items and pointer-events-none made
    // it genuinely untappable until the view was switched away and back.
    if(POS_STEP === 'menu') renderPosMenu();
  }
  else { saveCart(); renderCartBadge(); }
  showToast(item.name + ' added', 'success');
}

/* ---------- the cart survives a reload ----------
   It used to live only in page memory, so a phone call that made iOS discard the
   tab, or a stray refresh, silently emptied a half-built order. Keyed by session
   so it can never bleed into the next party at that table. */
function cartKey(){ return 'hs_cart_' + (CURRENT_SESSION || 'none'); }
function saveCart(){
  try{
    if(!CURRENT_SESSION) return;
    if(CART.length) localStorage.setItem(cartKey(), JSON.stringify(CART));
    else localStorage.removeItem(cartKey());
  } catch(e){}
}
function restoreCart(){
  try{
    const raw = localStorage.getItem(cartKey());
    if(!raw) return;
    const saved = JSON.parse(raw);
    if(!Array.isArray(saved)) return;
    // Drop anything taken off the menu or sold out while they were away.
    CART = saved.filter(c => {
      const live = MENU_ITEMS.find(m => m.id === c.menuItemId);
      return c.menuItemId === 'bottled-water' || (live && !isSoldOut(live));
    });
    if(CART.length < saved.length) showToast('Some saved items are no longer available', 'warning');
    if(CART.length) showToast('Your unsent items were restored', 'info');
  } catch(e){ CART = []; }
}

function getRecommendations(){
  const inCart = new Set(CART.map(c => c.menuItemId));
  const pool = MENU_ITEMS.filter(i => !inCart.has(i.id) && !isSoldOut(i));
  const byKeyword = (kw) => {
    const cat = MENU_CATS.find(c => String(c.name).toLowerCase().includes(kw));
    return cat ? pool.filter(i => i.categoryId === cat.id) : [];
  };
  const picks = [];
  const drink = byKeyword('drink').concat(byKeyword('beverage'), byKeyword('mocktail'))[0];
  const sweet = byKeyword('dessert').concat(byKeyword('sweet'))[0];
  if(drink) picks.push(drink);
  if(sweet && !picks.some(p => p.id === sweet.id)) picks.push(sweet);
  for(const c of pool){ if(picks.length >= 2) break; if(!picks.some(p => p.id === c.id)) picks.push(c); }
  return picks.slice(0, 2);
}

function buildItems(cart, mode){
  if(mode === 'course'){
    const order = MENU_CATS.map(c => c.id);
    const sorted = [...cart].sort((a,b) => order.indexOf(a.categoryId) - order.indexOf(b.categoryId));
    const first = order.indexOf(sorted[0]?.categoryId);
    return sorted.map(c => {
      const round = Math.max(1, order.indexOf(c.categoryId) - first + 1);
      return { id: uid(), menuItemId:c.menuItemId, name:c.name, price:c.price, qty:c.qty,
        kind: c.kind || 'dish', foodType: c.foodType || null,
        status: c.kind === 'service' ? 'ready' : (round === 1 ? 'new' : 'held'), round,
        spiceLevel:c.spiceLevel || null, addons:c.addons || [], notes:c.notes || null };
    });
  }
  return cart.map(c => ({ id: uid(), menuItemId:c.menuItemId, name:c.name, price:c.price, qty:c.qty,
    // A sealed bottle needs no cooking, so it starts at "ready" and lands straight
    // in the floor queue instead of sitting on a kitchen ticket.
    kind: c.kind || 'dish', foodType: c.foodType || null,
    status: c.kind === 'service' ? 'ready' : 'new',
    round:1, spiceLevel:c.spiceLevel || null, addons:c.addons || [], notes:c.notes || null }));
}

async function findOpenOrder(sessionId){
  const snap = await getDocs(query(col('orders'), where('sessionId', '==', sessionId), where('open', '==', true)));
  if(snap.empty) return null;
  const docs = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => toMillis(b.createdAt) - toMillis(a.createdAt));
  return docs[0];
}

async function bumpSoldCounts(cart){
  const today = new Date().toISOString().slice(0, 10);
  const batch = writeBatch(db);
  const merged = {};
  cart.forEach(c => { merged[c.menuItemId] = (merged[c.menuItemId] || 0) + c.qty; });
  // increment() is applied server-side, so two tables ordering the last portion
  // at the same moment can no longer overwrite each other's count.
  for(const [id, qty] of Object.entries(merged)){
    const local = MENU_ITEMS.find(i => i.id === id);
    if(local && local.soldDate !== today) batch.update(docIn('menuItems', id), { soldToday: qty, soldDate: today });
    else batch.update(docIn('menuItems', id), { soldToday: increment(qty), soldDate: today });
  }
  try{ await batch.commit(); } catch(e){ /* count is advisory, never block the order */ }
}

async function placeOrder({ table, sessionId, cart, mode, placedBy, orderKind }){
  const items = buildItems(cart, mode);
  const existing = await findOpenOrder(sessionId);

  if(existing){
    await updateDoc(docIn('orders', existing.id), {
      items: [...(existing.items || []), ...items],
      updatedAt: serverTimestamp()
    });
  } else {
    await addDoc(col('orders'), {
      tableId: table.id, tableNo: table.tableNo, sessionId,
      items, status:'active', open:true, orderKind: orderKind || 'dinein',
      paymentStatus:'unpaid', paymentMethod:null,
      billRequested:false, billRequestedAt:null, billSent:false, billSentAt:null,
      placedBy, createdAt: serverTimestamp(), updatedAt: serverTimestamp()
    });
  }
  await updateDoc(docIn('tables', table.id), { status:'occupied' });
  await bumpSoldCounts(cart);
  return !existing;
}

async function submitCustomerOrder(mode){
  if(CART.length === 0 || !requireOnline()) return;
  const msg = el('custMsg');
  clearMsg(msg);

  const live = await getDoc(docIn('tables', CURRENT_TABLE.id));
  if(!live.exists() || live.data().currentSession !== CURRENT_SESSION){
    showMsg(msg, 'This table session has ended. Ask a staff member to start it again.', 'error');
    el('cartDrawer').classList.add('hidden-view');
    return;
  }

  if(GEOFENCE.enabled && GEOFENCE.mode === 'block' && !live.data().geoOverride){
    const verdict = ['ok','override'].includes(GEO_STATE) ? GEO_STATE : await runGeoCheck();
    if(!['ok','override'].includes(verdict)){
      el('cartDrawer').classList.add('hidden-view');
      showMsg(msg, (GEO_COPY[verdict] || GEO_COPY.unknown).text + ' ' + (GEO_HELP[verdict] || ''), 'error');
      return;
    }
  }

  const btn = el('placeOrderBtn');
  btn.disabled = true;
  try{
    const isNew = await placeOrder({
      table: CURRENT_TABLE, sessionId: CURRENT_SESSION, cart: CART, mode,
      placedBy: { mode:'customer', by:null }
    });
    CART = [];
    saveCart();
    renderCartBadge();
    el('cartDrawer').classList.add('hidden-view');
    showToast(isNew ? 'Order sent to the kitchen' : 'Added to your order', 'success');
  } catch(e){
    showMsg(msg, 'Could not send the order: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
  }
}

// The square-with-a-dot mark Indian menus use for veg and non-veg.
function foodMark(type){
  const t = FOOD_TYPES[type];
  if(!t) return '';
  return `<span class="inline-flex items-center justify-center w-3.5 h-3.5 rounded-[3px] border-[1.5px] shrink-0" style="border-color:${t.ring}" title="${t.label}">
    <span class="w-1.5 h-1.5 rounded-full" style="background:${t.dot}"></span></span>`;

/* ---------- money on a bill: items, minus any discount ---------- */
function discountAmount(o){
  const d = o.discount;
  if(!d || !d.value) return 0;
  const sub = orderTotal(o);
  const raw = d.type === 'percent' ? sub * Number(d.value) / 100 : Number(d.value);
  return Math.min(sub, Math.max(0, Math.round(raw)));
}
function netTotal(o){ return Math.max(0, orderTotal(o) - discountAmount(o)); }

// Every order placed during this visit stays on screen with a live per-dish
// status, rather than only the most recent one showing in the bottom bar.
// Cooking and plating mean nothing for a sealed bottle, so service lines only
// ever read Requested or Served.
function itemStatusChip(i){
  if(i.status === 'cancelled') return { label:'Cancelled', cls:'bg-ink/10 text-ink/40' };
  if(i.kind === 'service'){
    return i.status === 'served'
      ? { label:'Served',    cls:'bg-basil text-white' }
      : { label:'Requested', cls:'bg-saffron/15 text-saffrond' };
  }
  return ITEM_STATUS[i.status] || ITEM_STATUS.new;
}

function renderOrderStatus(order){
  const bar = el('orderStatusBar');
  if(!order){ bar.classList.add('hidden-view'); return; }

  // A guest who paid without ever asking gets their bill anyway, so the counter
  // marking cash received still puts an itemised copy on their phone.
  if(order.billSent && BILL_AUTO_OPENED !== order.id){
    BILL_AUTO_OPENED = order.id;
    renderCustomerBill(order);
  }

  if(order.paymentStatus === 'paid'){
    const key = 'hs_feedback_' + order.id;
    if(localStorage.getItem(key)){
      bar.classList.remove('hidden-view');
      bar.innerHTML = `<div class="max-w-2xl mx-auto flex items-center justify-between gap-3">
        <div class="text-sm font-semibold">Paid — thank you</div>
        <button id="viewBillBtn" class="scale-tap bg-cream text-ink text-xs font-bold px-4 py-2.5 rounded-full shrink-0">View your bill</button>
      </div>`;
      el('viewBillBtn').addEventListener('click', () => renderCustomerBill(order));
      return;
    }
    if(FEEDBACK_DRAWN_FOR !== order.id){
      FEEDBACK_DRAWN_FOR = order.id;
      renderFeedbackPrompt(bar, order, key);
    }
    return;
  }
  FEEDBACK_DRAWN_FOR = null;

  const all     = liveItems(order);
  const visible = all.filter(i => i.status !== 'held');
  const held    = all.filter(i => i.status === 'held');
  const allServed = visible.length > 0 && visible.every(i => i.status === 'served');
  bar.classList.remove('hidden-view');

  if(allServed && held.length > 0){
    const nextRound = Math.min(...held.map(i => i.round));
    const nextItems = held.filter(i => i.round === nextRound);
    bar.innerHTML = `<div class="max-w-2xl mx-auto flex items-center justify-between gap-3">
      <div class="text-sm min-w-0">
        <div class="font-semibold">This course is served</div>
        <div class="text-cream/60 text-xs truncate">${nextItems.map(i => `${i.qty}× ${esc(i.name)}`).join(', ')} ready to go in</div>
      </div>
      <button id="fireNextBtn" class="scale-tap bg-saffron text-white text-xs font-bold px-4 py-2.5 rounded-full whitespace-nowrap shrink-0">Send next course</button>
    </div>`;
    el('fireNextBtn').addEventListener('click', async () => {
      if(!requireOnline()) return;
      const items = all.map(i => (i.status === 'held' && i.round === nextRound) ? { ...i, status:'new' } : i);
      await updateDoc(docIn('orders', order.id), { items, updatedAt: serverTimestamp() });
    });
    return;
  }

  // The per-dish rundown used to be repeated down here. It lives in the "Your
  // orders" panel at the top now, so this bar carries the action alone.
  const openCalls = MY_CALLS.filter(c => c.status !== 'resolved').length;
  const canAskForBill = allServed && held.length === 0 && openCalls === 0;

  let action, label;
  if(order.billSent){
    action = `<button id="viewBillBtn" class="scale-tap bg-cream text-ink text-xs font-bold px-4 py-2.5 rounded-full whitespace-nowrap shrink-0">View your bill</button>`;
    label  = 'Your bill is ready';
  } else if(order.billRequested){
    action = `<span class="text-xs text-cream/60 whitespace-nowrap shrink-0">Preparing your bill…</span>`;
    label  = 'Bill requested';
  } else if(canAskForBill){
    action = `<button id="requestBillBtn" class="scale-tap bg-saffron text-white text-xs font-bold px-4 py-2.5 rounded-full whitespace-nowrap shrink-0">Ask for the bill</button>`;
    label  = 'Everything is served';
  } else {
    // Asking for the bill mid-service confuses the counter, so the button only
    // appears once every dish and every request has been dealt with.
    action = '';
    label  = held.length ? 'More courses still to come'
           : openCalls   ? 'Your request is on the way'
           :               'Your order is with the kitchen';
  }

  bar.innerHTML = `<div class="max-w-2xl mx-auto flex items-center justify-between gap-3">
    <div class="text-sm font-semibold min-w-0 truncate">${esc(label)}</div>
    ${action}
  </div>`;

  const viewBtn = el('viewBillBtn');
  if(viewBtn) viewBtn.addEventListener('click', () => renderCustomerBill(order));

  const billBtn = el('requestBillBtn');
  if(billBtn) billBtn.addEventListener('click', async () => {
    if(!requireOnline()) return;
    billBtn.disabled = true;
    await updateDoc(docIn('orders', order.id), { billRequested:true, billRequestedAt: serverTimestamp() });
    await updateDoc(docIn('tables', order.tableId), { status:'bill_requested' });
  });
}

function renderFeedbackPrompt(bar, order, key){
  let stars = 0;
  bar.classList.remove('hidden-view');
  function draw(){
    bar.innerHTML = `<div class="max-w-2xl mx-auto">
      <div class="font-semibold text-sm mb-2">How was your meal?</div>
      <div class="flex gap-1.5 mb-2">
        ${[1,2,3,4,5].map(n => `<button data-star="${n}" class="star-btn text-2xl ${n <= stars ? 'text-saffron' : 'text-white/25'}" aria-label="${n} stars"><i class="fa-solid fa-star"></i></button>`).join('')}
      </div>
      <textarea id="fbComment" rows="1" placeholder="Tell us more (optional)" class="w-full bg-white/10 rounded-xl px-3 py-2 text-sm text-cream placeholder-cream/40 mb-2">${esc(bar.querySelector('#fbComment')?.value || '')}</textarea>
      <div class="flex gap-2">
        <button id="fbSubmit" class="scale-tap flex-1 bg-saffron text-ink text-sm font-bold py-2.5 rounded-full">Send feedback</button>
        <button id="fbSkip" class="scale-tap text-cream/50 text-xs font-semibold px-3">Not now</button>

    bar.querySelectorAll('.star-btn').forEach(b => b.addEventListener('click', () => { stars = Number(b.dataset.star); draw(); }));

      setTimeout(() => bar.classList.add('hidden-view'), 2500);

  }
  draw();
}

async function bootStaff(user){
  STAFF_BOOTED = true;
  el('staffEmail').textContent = user.email || '';

  const restSnap = await getDoc(restRef());
  if(!restSnap.exists()){
    staffBlocked('This Firebase project has no restaurant set up yet. Run the seed snippet from the setup guide, then reload.');
    return;
  }
  REST_INFO = { ...REST_INFO, ...restSnap.data() };
  applyBranding(restSnap.data().name);
  applyLogo(restSnap.data().logoUrl || null);

  let member = null;
  try{ const m = await getDoc(docIn('members', user.uid)); if(m.exists()) member = m.data(); } catch(e){}
  CURRENT_ROLE = member?.role || null;

  if(!CURRENT_ROLE){
    staffBlocked('This account has no role yet. Ask an admin to add you as admin, management, manager, counter or kitchen.');
    return;
  }

  try{
    const s = await getDoc(settingsRef());
    if(s.exists()){

// Walkout risk is worked out here, on the fly, from the bill time. The old build
// had every signed-in device racing to write an `unpaid_alert` status to the same
// table row; nothing was gained by storing it.
function isWalkoutRisk(order){
  if(order.paymentStatus !== 'unpaid' || !order.billRequested || !order.billRequestedAt) return false;
  return (Date.now() - toMillis(order.billRequestedAt)) >= WALKOUT_MINS * 60000;
}
function minutesLeft(order){
  const mins = WALKOUT_MINS - (Date.now() - toMillis(order.billRequestedAt)) / 60000;
  return Math.max(0, Math.ceil(mins));
}

function onLiveChange(){
  const newItems = LIVE_ORDERS.reduce((s,o) => s + (o.items || []).filter(i => i.status === 'new').length, 0);
  const ready    = LIVE_ORDERS.reduce((s,o) => s + (o.items || []).filter(i => i.status === 'ready').length, 0);
  if(PREV_NEW_ITEMS !== null && newItems > PREV_NEW_ITEMS){ playChime('order'); showToast('New kitchen ticket', 'info'); }
  if(PREV_CALLS !== null && LIVE_CALLS.length > PREV_CALLS){ playChime('call'); showToast('New floor request', 'warning'); }
  PREV_NEW_ITEMS = newItems; PREV_CALLS = LIVE_CALLS.length; PREV_READY = ready;

  el('kitchenAlertDot').classList.toggle('hidden', newItems === 0);
  const billsToSend = LIVE_ORDERS.filter(o => o.billRequested && !o.billSent && o.paymentStatus === 'unpaid').length;
  el('managerAlertDot').classList.toggle('hidden', LIVE_CALLS.length + ready + billsToSend === 0);
  el('counterAlertDot').classList.toggle('hidden', !LIVE_ORDERS.some(isWalkoutRisk));
  const parcelsWaiting = LIVE_PARCELS.filter(b => ['ready','unpaid'].includes(parcelStage(parcelOrder(b)))).length;
  el('parcelAlertDot').classList.toggle('hidden', parcelsWaiting === 0);

  renderActiveView();
}

/* ---------- geofence ----------
   A deterrent, not a lock. Phone GPS indoors is often 50-100m out, and location
   can be spoofed, so this catches the casual prank order from across town rather
   than a determined one. The radius is deliberately generous by default. */
let GEOFENCE = { enabled:false, lat:null, lng:null, radiusM:200, mode:'warn' };
let PIN_REQUIRED = true;
// Floor and Counter can be switched off so staff work only from Tables and Parcels.
let MODULES = { manager: true, counter: true };
let GEO_STATE = 'idle';   // idle | checking | ok | far | unknown | denied | unavailable | inapp | override

// Four digits, never 0000 and never a run like 1111, so it is easy to say aloud
// across a noisy room but not guessable on the first try.
function genPin(){
  let pin;
  do { pin = String(Math.floor(1000 + Math.random() * 9000)); }
  while(/^(\d)\1{3}$/.test(pin));
  return pin;
}

/* ---------- geofence ----------
   Rebuilt to fail softly. The menu now loads immediately and the check runs
   behind it; location only has to have passed by the time an order is sent. */
function metresBetween(lat1, lng1, lat2, lng2){
  const toRad = (d) => d * Math.PI / 180;
  const R = 6371000;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2) ** 2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}

function getPosition(timeoutMs = 10000, highAccuracy = true){
  return new Promise((resolve, reject) => {
    if(!navigator.geolocation) return reject(Object.assign(new Error('unsupported'), { code: 2 }));
    navigator.geolocation.getCurrentPosition(resolve, reject,
      { enableHighAccuracy: highAccuracy, timeout: timeoutMs, maximumAge: highAccuracy ? 30000 : 120000 });
  });
}

// Instagram, WhatsApp and similar wrap pages in a cut-down browser that often
// refuses location outright. Worth naming, rather than calling the guest far away.
function isInAppBrowser(){
  return /FBAN|FBAV|Instagram|Line\/|Twitter|WhatsApp|Snapchat|MicroMessenger/i.test(navigator.userAgent || '');
}

async function geoPermissionState(){
  try{ return (await navigator.permissions.query({ name:'geolocation' })).state; }
  catch(e){ return 'unknown'; }
}

// Three answers, not two. A reading accurate to within two kilometres says
// nothing useful, and the old code counted that as "outside".
function verdictFor(pos){
  const acc = pos.coords.accuracy || 0;
  if(acc > 1000) return 'unknown';
  const d = metresBetween(pos.coords.latitude, pos.coords.longitude, GEOFENCE.lat, GEOFENCE.lng);
  if(d <= GEOFENCE.radiusM + Math.min(acc, 150)) return 'ok';
  if(d - acc <= GEOFENCE.radiusM) return 'unknown';   // straddling the edge
  return 'far';
}

async function resolveGeo(){
  if(!GEOFENCE.enabled || GEOFENCE.lat == null) return 'ok';
  if(CURRENT_TABLE?.geoOverride) return 'override';
  try{ if(localStorage.getItem('hs_geo_ok_' + CURRENT_SESSION)) return 'ok'; } catch(e){}

  if(await geoPermissionState() === 'denied') return isInAppBrowser() ? 'inapp' : 'denied';

  // A wifi or cell-tower fix lands in a second or two and is easily good enough to
  // tell "in the building" from "across town". GPS is only worth the wait if that
  // first answer sits on the boundary.
  try{
    const rough = await getPosition(8000, false);
    const v = verdictFor(rough);
    if(v === 'ok' || v === 'far') return v;
  } catch(e){
    if(e.code === 1) return isInAppBrowser() ? 'inapp' : 'denied';
  }
  try{
    return verdictFor(await getPosition(25000, true));
  } catch(e){
    if(e.code === 1) return isInAppBrowser() ? 'inapp' : 'denied';
    return 'unavailable';
  }
}

const GEO_COPY = {
  checking:    { tone:'info',    text:'Confirming you are at the restaurant…' },
  far:         { tone:'error',   text:'You seem to be away from the restaurant.' },
  unknown:     { tone:'warning', text:'Could not pin down your location accurately.' },
  denied:      { tone:'warning', text:'Location permission is blocked for this site.' },
  unavailable: { tone:'warning', text:'No location signal right now.' },
  inapp:       { tone:'warning', text:'This in-app browser blocks location.' },
};
const GEO_HELP = {
  denied:      'Tap the lock icon next to the web address, allow Location, then Retry.',
  inapp:       'Open this page in Chrome or Safari, or ask a staff member to order for you.',
  unavailable: 'Move near a window and tap Retry, or ask a staff member to order for you.',
  unknown:     'Tap Retry, or ask a staff member to order for you.',
  far:         'Ordering works at the table. A staff member can place the order for you.',
};

function renderGeoBanner(){
  const box = el('geoBanner');
  if(!box) return;
  if(!GEOFENCE.enabled || ['ok','override','idle'].includes(GEO_STATE)){
    box.classList.add('hidden-view'); box.innerHTML = ''; return;
  }
  const c = GEO_COPY[GEO_STATE] || GEO_COPY.unknown;
  const tone = { info:'bg-ink/5 text-ink/60', warning:'bg-saffron/15 text-saffrond', error:'bg-chili/10 text-chili' }[c.tone];
  const blocking = GEOFENCE.mode === 'block';
  box.classList.remove('hidden-view');
  box.innerHTML = `<div class="${tone} rounded-2xl px-3 py-2.5 text-xs">
    <div class="flex items-center justify-between gap-2">
      <span class="font-semibold">${esc(c.text)}</span>
      ${GEO_STATE === 'checking' ? '' : `<button id="geoRetry" class="scale-tap font-bold underline shrink-0">Retry</button>`}
    </div>
    ${GEO_STATE === 'checking' ? '' : `<div class="mt-1 opacity-80">${esc(GEO_HELP[GEO_STATE] || '')}${blocking ? '' : ' You can still order.'}</div>`}
  </div>`;
  const retry = el('geoRetry');
  if(retry) retry.addEventListener('click', runGeoCheck);
}

async function runGeoCheck(){
  if(!GEOFENCE.enabled) { GEO_STATE = 'ok'; return 'ok'; }
  GEO_STATE = 'checking';
  renderGeoBanner();
  GEO_STATE = await resolveGeo();
  if(GEO_STATE === 'ok'){ try{ localStorage.setItem('hs_geo_ok_' + CURRENT_SESSION, '1'); } catch(e){} }
  renderGeoBanner();
  return GEO_STATE;
}

            <span class="font-semibold text-ink/70">${esc(l.action)}</span> ${esc(l.detail || '')} — ${esc(l.reason || '')}
            <span class="text-ink/30">· ${esc(l.by || '')}</span></div>`).join('')}
        </div></div>` : ''}`;

    el('asClose').addEventListener('click', closeActionSheet);
    body().querySelectorAll('.it-qty').forEach(b => b.addEventListener('click', () => { target = Number(b.dataset.i); view = 'qty'; picked = null; draw(); }));
    body().querySelectorAll('.it-swap').forEach(b => b.addEventListener('click', () => { target = Number(b.dataset.i); view = 'swap'; picked = null; replaceWith = null; search = ''; draw(); }));
    body().querySelectorAll('.it-cancel').forEach(b => b.addEventListener('click', () => { target = Number(b.dataset.i); view = 'cancel'; picked = null; draw(); }));
  }

  function reasonBlock(){
    return `<div class="text-xs font-semibold text-ink/60 mb-2">Reason <span class="text-chili">Required</span></div>
      <div class="grid grid-cols-2 gap-2 mb-3">
        ${ITEM_CHANGE_REASONS.map(r => `<button class="rs-opt scale-tap text-xs font-semibold py-2.5 px-2 rounded-xl border ${picked === r ? 'bg-ink text-cream border-ink' : 'bg-surface border-ink/15'}" data-r="${escAttr(r)}">${esc(r)}</button>`).join('')}
      </div>
      <input id="rsNote" class="w-full mb-4 px-3 py-2 rounded-xl border border-ink/15 text-sm" placeholder="Other reason (optional)">
      <div id="rsErr"></div>`;
  }
  function wireReasons(redraw){
    body().querySelectorAll('.rs-opt').forEach(b => b.addEventListener('click', () => {
      const note = el('rsNote')?.value || '';
      picked = picked === b.dataset.r ? null : b.dataset.r;
      redraw();
      if(el('rsNote')) el('rsNote').value = note;
    }));
  }
  function reasonText(){ return [picked, el('rsNote')?.value.trim()].filter(Boolean).join(' — '); }

  function header(title, sub){
    return `<div class="flex items-center justify-between mb-1">
        <div class="font-display font-bold text-xl">${esc(title)}</div>
        <button id="asBack" class="w-8 h-8 rounded-full bg-ink/5 flex items-center justify-center" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button>
      </div>
      <p class="text-xs text-ink/50 mb-4">${esc(sub)}</p>`;
  }

  async function commit(items, entry){
    if(!requireOnline()) return;
    await updateDoc(docIn('orders', orderId), {
      items, itemLog: await logItemChange(order, entry), updatedAt: serverTimestamp()
    });
    closeActionSheet();
    showToast(entry.action + ' saved', 'success');
  }

  function drawQty(){
    const item = order.items[target];
    let qty = item.qty;
    const render = () => {
      body().innerHTML = header('Change quantity', `${item.name} · currently ${item.qty}`) + `
        <div class="flex items-center justify-center gap-6 mb-5">
          <button id="qDec" class="w-12 h-12 rounded-full bg-ink/5 text-xl font-bold">−</button>
          <span class="font-mono-num font-bold text-4xl w-12 text-center">${qty}</span>
          <button id="qInc" class="w-12 h-12 rounded-full bg-ink/5 text-xl font-bold">+</button>
        </div>
        ${reasonBlock()}
        <button id="qSave" class="scale-tap w-full bg-ink text-cream font-bold py-3 rounded-2xl">Save quantity</button>`;
      el('asBack').addEventListener('click', () => { view = 'list'; draw(); });
      el('qDec').addEventListener('click', () => { if(qty > 1) qty--; render(); });
      el('qInc').addEventListener('click', () => { qty++; render(); });
      wireReasons(render);
      el('qSave').addEventListener('click', async () => {
        const reason = reasonText();
        if(!reason){ showMsg(el('rsErr'), 'Pick a reason for the change.', 'error'); return; }
        if(qty === item.qty){ showMsg(el('rsErr'), 'The quantity has not changed.', 'error'); return; }
        const items = order.items.map((x, ix) => ix === target ? { ...x, qty } : x);
        await commit(items, { action:'Quantity changed', detail:`${item.name} ${item.qty} → ${qty}`, reason });
      });
    };
    render();
  }

  function drawSwap(){
    const item = order.items[target];
    const render = () => {
      const pool = MENU_ITEMS.filter(m => !isSoldOut(m) && m.id !== item.menuItemId &&
        (!search || String(m.name).toLowerCase().includes(search.toLowerCase()))).slice(0, 40);
      body().innerHTML = header('Replace item', `Swapping out ${item.qty}× ${item.name}`) + `
        <input id="swSearch" type="search" value="${escAttr(search)}" placeholder="Search for the replacement…" class="w-full mb-3 px-3 py-2.5 rounded-xl border border-ink/15 text-sm">
        <div class="grid grid-cols-2 gap-2 mb-4 max-h-52 overflow-y-auto">
          ${pool.map(m => `<button class="sw-opt scale-tap text-left p-2.5 rounded-xl border ${replaceWith === m.id ? 'bg-ink text-cream border-ink' : 'bg-surface border-ink/15'}" data-id="${escAttr(m.id)}">
            <div class="text-xs font-semibold leading-tight">${esc(m.name)}</div>
            <div class="text-[10px] font-mono-num ${replaceWith === m.id ? 'text-cream/60' : 'text-ink/40'}">${money(m.price)}</div>
          </button>`).join('') || `<p class="text-xs text-ink/40 col-span-2 py-4 text-center">Nothing matches.</p>`}
        </div>
        ${reasonBlock()}
        <button id="swSave" class="scale-tap w-full bg-ink text-cream font-bold py-3 rounded-2xl">Replace</button>`;
      el('asBack').addEventListener('click', () => { view = 'list'; draw(); });
      const box = el('swSearch');
      box.addEventListener('input', () => { const at = box.selectionStart; search = box.value; render(); const n = el('swSearch'); n.focus(); n.setSelectionRange(at, at); });
      body().querySelectorAll('.sw-opt').forEach(b => b.addEventListener('click', () => { replaceWith = b.dataset.id; render(); }));
      wireReasons(render);
      el('swSave').addEventListener('click', async () => {
        const reason = reasonText();
        if(!replaceWith){ showMsg(el('rsErr'), 'Choose the replacement dish.', 'error'); return; }
        if(!reason){ showMsg(el('rsErr'), 'Pick a reason for the swap.', 'error'); return; }
        const m = MENU_ITEMS.find(x => x.id === replaceWith);
        const items = order.items.map((x, ix) => ix === target ? {
          ...x, menuItemId:m.id, name:m.name, price:m.price, foodType:m.foodType || null,
          status:'new', addons:[], spiceLevel:null
        } : x);
        await commit(items, { action:'Item replaced', detail:`${item.name} → ${m.name}`, reason });
      });
    };
    render();
  }

  function drawCancel(){
    const item = order.items[target];
    const render = () => {
      body().innerHTML = header('Cancel this item', `${item.qty}× ${item.name} · ${money(item.price * item.qty)}`) + `
        <p class="text-xs text-ink/50 mb-4">The line stays on the record for your accounts but is removed from the kitchen and from the bill.</p>
        ${reasonBlock()}
        <button id="cSave" class="scale-tap w-full bg-chili text-white font-bold py-3 rounded-2xl">Cancel this item</button>`;
      el('asBack').addEventListener('click', () => { view = 'list'; draw(); });
      wireReasons(render);
      el('cSave').addEventListener('click', async () => {
        const reason = reasonText();
        if(!reason){ showMsg(el('rsErr'), 'Pick a reason before cancelling.', 'error'); return; }
        const items = order.items.map((x, ix) => ix === target ? { ...x, status:'cancelled', cancelReason: reason } : x);
        await commit(items, { action:'Item cancelled', detail:`${item.qty}× ${item.name}`, reason });
      });
    };
    render();
  }

  function draw(){
    if(view === 'qty')    return drawQty();
    if(view === 'swap')   return drawSwap();
    if(view === 'cancel') return drawCancel();
    drawList();
  }
  draw();
  el('actionSheet').classList.remove('hidden-view');
}

/* ---------- payment, with a UPI code the guest can scan ---------- */
function upiUri(order, amount){
  const pa = (REST_INFO.upiId || '').trim();
  if(!pa) return null;
  const q = new URLSearchParams({
    pa, pn: REST_INFO.name || 'Restaurant',
    am: Number(amount).toFixed(2), cu: 'INR',
    tn: billLabel(order) + ' ' + spotLabel(order)
  });
  return 'upi://pay?' + q.toString();
}

const UPI_APPS = [
  { name:'Any UPI app', scheme:'upi://pay?',        icon:'fa-indian-rupee-sign' },
  { name:'Google Pay',  scheme:'tez://upi/pay?',    icon:'fa-google' },
  { name:'PhonePe',     scheme:'phonepe://pay?',    icon:'fa-mobile-screen' },
  { name:'Paytm',       scheme:'paytmmp://pay?',    icon:'fa-wallet' },
];

async function settlePayment(order, method, box){
  if(!requireOnline()) return;
  try{ await assignBillNo(order.id); } catch(e){}
  const handedOver = liveItems(order).every(i => i.status === 'served');
  const isParcel = isParcelOrder(order);
  await updateDoc(docIn('orders', order.id), {
    paymentStatus:'paid', billSent:true, paymentMethod: method, paidAt: serverTimestamp(),
    total: netTotal(order), subtotal: orderTotal(order), discountValue: discountAmount(order),
    // A parcel paid before the food is ready must stay on the kitchen screen.
    ...((!isParcel || handedOver) ? { status:'paid', open:false } : {})
  });
  if(!isParcel || handedOver){
    const tableId = box?.id || order.tableId;
    if(tableId) await updateDoc(docIn('tables', tableId), {
      status:'available', ...(isParcel ? {} : { currentSession:null, sessionPin:null, geoOverride:false })
    });
  }
  REPORTS_LOADED = false;
  closeActionSheet();
  showToast(isParcel && !handedOver ? 'Paid upfront — still cooking' : 'Payment recorded', 'success');
}

function wireOrderActions(scope, order, spot, isParcel){
  if(!order) return;
  const go = (sel, fn) => scope.querySelectorAll(sel).forEach(b => b.addEventListener('click', fn));
  go('.oa-take', () => {
    POS_TABLE = spot; POS_CART = []; POS_SEARCH = ''; POS_STEP = 'menu'; POS_IS_PARCEL = isParcel;
    closeActionSheet(); closeTableSheet();
    switchStaffView('pos');
  });
  go('.oa-edit',     () => { closeActionSheet(); closeTableSheet(); openItemsSheet(order.id); });
  go('.oa-discount', () => { closeActionSheet(); closeTableSheet(); openDiscountSheet(order); });
  go('.oa-print',    () => printBill(order.id));
  go('.oa-cancel',   () => { closeActionSheet(); closeTableSheet(); openCancelSheet(order); });
  go('.oa-pay',      () => {
    if(order.paymentStatus === 'paid'){ showToast('This order is already paid', 'info'); return; }
    closeTableSheet(); openPaymentSheet(order, isParcel ? spot : null);
  });
  go('.oa-sendbill', async (e) => {
    e.target.disabled = true;
    await sendBillToGuest(order.id);
    closeActionSheet(); closeTableSheet();
  });
  go('.oa-deliver', async (e) => {
    if(!requireOnline()) return;
    e.target.disabled = true;
    const items = (order.items || []).map(i => i.status === 'cancelled' ? i : { ...i, status:'served' });
    const paid = order.paymentStatus === 'paid';
    await updateDoc(docIn('orders', order.id), { items, updatedAt: serverTimestamp(), ...(paid ? { status:'paid', open:false } : {}) });
    if(paid && spot) await updateDoc(docIn('tables', spot.id), { status:'available' });
    REPORTS_LOADED = false;
    closeActionSheet();
    showToast(paid ? 'Collected — slot is free' : 'Handed over — awaiting payment', 'success');
  });
}

/* ---------- sequential bill numbers ----------
   Firestore document ids are random strings, so a guest was being shown
   something like "K3JD8XZQ" as their bill number. Numbers are now handed out
   in order from a counter document, inside a transaction so two staff sending
   two bills at the same moment cannot land on the same number. */
async function assignBillNo(orderId){
  const orderRef = docIn('orders', orderId);
  return runTransaction(db, async (tx) => {
    const order = await tx.get(orderRef);
    if(!order.exists()) return null;
    if(order.data().billNoLabel) return order.data().billNoLabel;   // already numbered

    const counter = await tx.get(countersRef());
    const prefix  = counter.exists() ? (counter.data().billPrefix ?? 'HS-') : 'HS-';
    const next    = counter.exists() ? Number(counter.data().billSeq || 0) + 1 : 1;
    const label   = prefix + String(next).padStart(4, '0');

    tx.set(countersRef(), { billPrefix: prefix, billSeq: next }, { merge: true });
    tx.update(orderRef, { billNo: next, billNoLabel: label });
    return label;
  });
}
function billLabel(o){ return o.billNoLabel || (o.id ? o.id.slice(0,8).toUpperCase() : '—'); }

/* ---------- shared: send the bill to the guest's phone ---------- */
async function sendBillToGuest(orderId){
  if(!requireOnline()) return;
  try{ await assignBillNo(orderId); } catch(e){ /* fall back to the short id */ }
  await updateDoc(docIn('orders', orderId), {
    billSent: true, billSentAt: serverTimestamp(),
    billSentBy: CURRENT_USER?.email || 'staff',
    billRequested: true,
    updatedAt: serverTimestamp()
  });
  showToast('Bill sent to the table', 'success');
}

/* ---------- shared: change one item's status inside an order ---------- */
async function setItemStatus(orderId, itemId, status){
  if(!requireOnline()) return;
  const snap = await getDoc(docIn('orders', orderId));
  if(!snap.exists()) return;
  const items = (snap.data().items || []).map(i => i.id === itemId ? { ...i, status } : i);
  await updateDoc(docIn('orders', orderId), { items, updatedAt: serverTimestamp() });
}
